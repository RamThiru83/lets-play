      else if(pred==null)c.area.append(h('p',{class:'ask'},'Will the '+it.n+' sink or float?'));
      else c.area.append(h('p',{class:'ask'},'You think it will '+(pred==='f'?'float':'sink')+'.'));
      c.area.append(h('div',{class:'tank'+(res?(it.f?' float':' sink'):'')},h('div',{class:'water'}),h('span',{class:'thing','aria-hidden':'true'},art(it.p,64))));
      if(!res){if(pred==null)c.area.append(h('div',{class:'opts'},btn('Sink','go',()=>{pred='s';c.fx('predict','Now test it!');render();},'down'),btn('Float','go',()=>{pred='f';c.fx('predict','Now test it!');render();},'up')));
        else c.area.append(btn('Test it!','go',test,'play'));}
      else{if((pred==='f')!==!!it.f)c.area.append(h('p',{class:'ask'},'Why do you think so?'),h('div',{class:'chips'},['It is light','It is heavy','It has air in it','I do not know. I will test another!'].map(t=>chip(t,()=>c.reason(t)))));}}
    if(log.length)c.area.append(h('div',{class:'log'},h('span',{class:'note'},'Tested:'),log.map(l=>h('span',{class:'logitem'},art(l.p,30),h('small',null,l.ok?'matched':'surprise')))));
  }
  function test(){const it=items[cur];res=it.f?'f':'s';const ok=(pred==='f')===!!it.f;log.push({p:it.p,ok});
    if(ok)c.fx('try','It '+(it.f?'floated':'sank')+', like you thought.');
    else c.fx('try','Surprise! You thought it would '+(pred==='f'?'float':'sink')+'. Surprises help scientists learn.');
    if(c.level===2&&it.n.startsWith('clay'))c.later(()=>c.say('The clay ball and the clay boat are the same clay. What did we change?','think'),3200);
    render();const t=c.area.querySelector('.tank');if(t&&t.scrollIntoView)t.scrollIntoView({block:'nearest',behavior:'smooth'});}
  c.setAsk(()=>[{q:'What helps me guess?',a:'Think: is it heavy for its size? Does it have air inside?'},{q:'Which should I test first?',a:'Pick one you are not sure about. That is where you learn the most.'}]);
  c.intro('Pick something. Guess if it will sink or float. Then test it.','smile');render();}};

/* ===== Who Knows? ===== */
const QL1=[{q:'What colour is a banana?',pic:'banana',r:'Yellow',w:'Blue',owl:1},{q:'How many legs has a dog?',pic:'dog',r:'Four',w:'Seven',owl:1},{q:'Where do fish live?',pic:'fish',r:'In water',w:'In trees',owl:1},{q:'What is ice like?',pic:'ice',r:'Cold',w:'Hot',owl:1},{q:'What do bees make?',pic:'bee',r:'Honey',w:'Pizza',owl:0},{q:'Which animal says moo?',pic:'cow',r:'A cow',w:'A duck',owl:1}];
const QL2=[{q:'What is bread made from?',pic:'bread',r:'Flour',w:'Stones',t:'food'},{q:'What colour is a carrot?',pic:'carrot',r:'Orange',w:'Blue',t:'food'},{q:'Which is a fruit?',pic:'apple',r:'An apple',w:'A shoe',t:'food'},
 {q:'What do rabbits like to eat?',pic:'rabbit',r:'Carrots',w:'Fish',t:'animal'},{q:'How many legs has a spider?',pic:'spider',r:'Eight',w:'Four',t:'animal'},{q:'Where do penguins live?',pic:'penguin',r:'Cold places',w:'Hot deserts',t:'animal'}];
GAMES.whoknows={title:'Who Knows?',hat:'sci',tile:'t_whoknows',blurb:'Two puppets answer. Who can you trust?',
 levels:['Owl and Fox','Chef and Vet'],
 grown:{skill:'Judging who to trust from how often they were right; knowing that experts know some things only.',ask:'Who would you ask next time? Why? Would you ask the Chef about animals?',praise:'"You checked before you trusted." "You noticed who was right more often."'},
 init(c){
  const P=c.level===1?[{pic:'owl',n:'Owl'},{pic:'fox',n:'Fox'}]:[{pic:'chef',n:'Chef'},{pic:'vet',n:'Vet'}];
  const Q=c.level===1?QL1:QL2;let asked=null,checked=false,trust=null,over=false;const done=new Set();const tally=P.map(()=>[]);
  /* Level 1: the owl is right on most questions and the fox on the others. Level 2: each knows their own subject. */
  const say=(qq,i)=>{let right;if(c.level===1){const owlRight=qq.owl===1;right=i===0?owlRight:!owlRight;}else right=(qq.t==='food')===(i===0);return right?qq.r:qq.w;};
  let answers=null;
  function render(){
    c.area.replaceChildren();
    if(asked==null){c.area.append(h('div',{class:'puppets'},P.map(p=>h('div',{class:'pup'},art(p.pic,72),h('b',null,p.n)))),h('p',{class:'ask'},'Pick a question to ask both puppets.'),
      h('div',{class:'chips'},Q.map((qq,k)=>chip(qq.q,()=>ask(k),{pic:qq.pic,disabled:done.has(k)}))));}
    else{const qq=Q[asked];
      c.area.append(h('div',{class:'claim'},art(qq.pic,64),h('h3',null,qq.q)),h('div',{class:'puppets'},P.map((p,i)=>{const ok=answers[i]===qq.r;
        return h('div',{class:'pup'+(checked?(ok?' right':' wrong'):'')},art(p.pic,72),h('b',null,p.n),
          h('span',{class:'ans'},'“'+answers[i]+'”',h('button',{class:'hear',type:'button','aria-label':'Hear '+p.n,onclick:()=>c.say(p.n+' says '+answers[i].toLowerCase()+'.','smile')},ICON.speaker())),
          checked?h('span',{class:'verdict'},art(ok?'tick':'cross',30),h('small',null,ok?'was right':'was not right')):null);})),
        checked?h('div',{class:'center'},art(qq.pic,64),h('b',null,'The answer: '+qq.r)):btn('Check the picture','go',check,'lens'),
        checked&&!over?btn('Ask another','go',()=>{asked=null;checked=false;render();c.say('Pick another question.','smile');},'play'):null);}
    if(tally.some(t=>t.length))c.area.append(h('div',{class:'tallyrow'},P.map((p,i)=>h('div',{class:'tally'},art(p.pic,34),h('span',{class:'tl'},tally[i].map(r=>art(r?'tick':'cross',22))),h('small',{class:'sr'},p.n+' was right '+tally[i].filter(Boolean).length+' of '+tally[i].length+' times')))));
    if(done.size>=3&&asked==null&&!over){
      if(trust==null)c.area.append(h('p',{class:'ask'},c.level===1?'Who would you ask next time?':'Who would you ask about animals?'),h('div',{class:'chips'},P.map((p,i)=>chip(p.n,()=>{trust=i;c.fx('explain','Thank you. Why do you trust '+p.n+'?');render();},{pic:p.pic}))));
      else c.area.append(h('p',{class:'ask'},'Why do you trust '+P[trust].n+'?'),h('div',{class:'chips'},['They were right more often','The other one said silly things','Just a feeling'].map(t=>chip(t,()=>c.reason(t)))),btn('Tell Spark how it went','go',()=>c.finish(),'tick'));}
  }
  function ask(k){asked=k;checked=false;answers=P.map((_,i)=>say(Q[k],i));c.count('question');
    c.say(Q[k].q,'think',P[0].n+' says '+answers[0].toLowerCase()+'. '+P[1].n+' says '+answers[1].toLowerCase()+'. Do they agree?');render();}
  function check(){checked=true;done.add(asked);P.forEach((_,i)=>tally[i].push(answers[i]===Q[asked].r));c.fx('try','Checking the picture is how we find out who is right.');render();}
  c.setAsk(()=>[{q:'Who is right?',a:'I do not know yet. How could we find out?'},{q:'Can I trust someone who is wrong sometimes?',a:'Maybe, but watch how often. Keep a tally of who is right.'}]);
  c.intro('Ask the puppets a question. Then check who is right.','smile');render();}};

/* ===== Take the Last Stone ===== */
const SLV=[{n:5,m:2,p:.5},{n:7,m:2,p:.7},{n:10,m:3,p:.9}];
GAMES.stones={title:'Take the Last Stone',hat:'big',tile:'t_stones',blurb:'Take stones in turns. Try to take the last one.',
 levels:['5 stones, take 1 or 2','7 stones, take 1 or 2','10 stones, take 1 to 3'],
 grown:{skill:'Working backwards from the end; finding a strategy by playing and noticing. At the first level Spark sometimes plays a weaker move, so a child can discover the pattern.',ask:'What did you notice when Spark took the last stone? How many stones do you want to leave Spark?',praise:'"You tried a different first move." "You noticed a pattern."'},
 init(c){
  const {n,m,p}=SLV[c.level-1];let left=n,over=false,turn='you';
  function render(){
    c.area.replaceChildren(h('div',{class:'stones'},Array.from({length:left},()=>art('stone',50))),
      h('p',{class:'note'},left+' stone'+(left===1?'':'s')+' left.'),
      over?null:h('div',{class:'opts'},Array.from({length:Math.min(m,left)},(_,k)=>k+1).map(k=>h('button',{class:'btn go take',type:'button',disabled:turn!=='you','aria-label':'Take '+k,onclick:()=>take(k)},h('span',{class:'mini'},Array.from({length:k},()=>art('stone',26))),h('span',null,'Take '+k)))));}
  function end(who){over=true;c.setAsk(null);render();
    c.say(who==='you'?'You took the last stone!':'Spark took the last stone.','smile',who==='you'?'How did you do it?':'What will you change next time?');
    c.area.append(h('div',{class:'chips'},['I took a different number first','I left Spark a special number','I am not sure yet'].map(t=>chip(t,()=>c.reason(t)))),
      h('div',{class:'tray'},btn('Play again, try something different','go',()=>{c.fx('change');left=n;over=false;turn='you';render();c.say('A new game. What will you try first?','smile');},'replay'),btn('Tell Spark how it went','ghost',()=>c.finish(),'tick')));}
  function take(k){if(turn!=='you'||over)return;left-=k;if(left===0){c.count('try');end('you');return;}c.fx('try');turn='spark';render();
    c.later(()=>{let t=left%(m+1);if(t===0||Math.random()>p)t=1+rnd(Math.min(m,left));left-=t;c.say('Spark takes '+t+'.','smile');if(left===0){end('spark');return;}turn='you';render();},1500);}
  c.setAsk(()=>over?[]:[{q:'Does the number I leave matter?',a:'Yes! Some numbers are good to leave for Spark. Play again and notice what Spark could not beat.'},
    {q:'What should I take now?',a:(left%(m+1)===0?'Any number is fine now, but Spark may have the good position.':'Try taking '+(left%(m+1))+' so that '+(left-left%(m+1))+' are left.')}]);
  c.intro('Take '+(m===2?'1 or 2':'1 to 3')+' stones each turn. Try to take the last stone. You go first.','smile');render();}};

/* ===== Noughts and Crosses ===== */
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
GAMES.ttt={title:'Noughts and Crosses',hat:'big',tile:'t_ttt',blurb:'Play, then go back to find where it changed.',
 levels:['Friendly Spark','Sharper Spark'],
 grown:{skill:'Spotting threats and chances; reviewing a game to find the turning point.',ask:'Where could you have stopped Spark? Where could Spark have stopped you?',praise:'"You went back and tried a different move." "You noticed Spark was about to win."'},
 init(c){
  let b,hist,over,flash=null,busy=false;
  const win=(bd,p)=>LINES.find(l=>l.every(i=>bd[i]===p));
  const winning=(bd,p)=>{const r=[];for(let i=0;i<9;i++)if(!bd[i]){bd[i]=p;if(win(bd,p))r.push(i);bd[i]=null;}return r;};
  function reset(){b=Array(9).fill(null);hist=[];over=false;busy=false;render();}
  function sparkMove(){const e=[...b.keys()].filter(i=>!b[i]);if(!e.length)return;
    const w=winning(b,'O');if(w.length)return w[0];
    const bl=winning(b,'X');if(bl.length&&(c.level===2||Math.random()<.5))return bl[0];
    if(c.level===2){if(!b[4])return 4;const cr=[0,2,6,8].filter(i=>!b[i]);if(cr.length)return pick(cr);}
    return pick(e);}
  function render(){
    c.area.replaceChildren(h('div',{class:'board'},b.map((v,i)=>h('button',{class:'sq'+(flash===i?' flash':''),type:'button','aria-label':'Square '+(i+1)+(v?', '+(v==='X'?'cross':'nought'):''),disabled:over||busy||!!v,onclick:()=>play(i)},v?art(v==='X'?'x':'o',50):''))));
    if(over)c.area.append(h('p',{class:'ask'},'Go back to a move and try something different:'),h('div',{class:'chips'},hist.map((m,k)=>m.p==='X'?chip('Before my move '+(Math.floor(k/2)+1),()=>rewind(k)):null).filter(Boolean)),btn('New game','ghost',reset,'replay'));}
  function finish(){over=true;busy=false;c.setAsk(null);const w=win(b,'X')?'x':win(b,'O')?'o':'d';
    render();c.say(w==='x'?'You got three in a row!':w==='o'?'Spark got three in a row.':'The board is full. No one got three.','smile','Where could you have stopped Spark, or made two chances at once?');}
  function play(i){if(busy||over||b[i])return;busy=true;b[i]='X';hist.push({p:'X',i});if(win(b,'X')||b.every(Boolean)){c.count('try');finish();return;}c.fx('try');
    render();c.later(()=>{const m=sparkMove();b[m]='O';hist.push({p:'O',i:m});if(win(b,'O')||b.every(Boolean)){finish();return;}busy=false;render();},900);}
  function rewind(k){const keep=hist.slice(0,k);b=Array(9).fill(null);keep.forEach(m=>b[m.i]=m.p);hist=keep;over=false;busy=false;setAskNow();c.fx('change','You went back. What will you try this time?');render();}
  function hl(cells){flash=cells[0];render();c.later(()=>{flash=null;render();},2500);}
  function setAskNow(){c.setAsk(()=>over?[]:[{q:'Can Spark win next turn?',a:(()=>{const w=winning(b,'O');return w.length?'Yes! Spark could win in the square that is lit up.':'No, Spark cannot win next turn.';})(),run:()=>{const w=winning(b,'O');if(w.length)hl(w);}},
    {q:'Can I win next turn?',a:(()=>{const w=winning(b,'X');return w.length?'Yes! Look at the square that is lit up.':'Not yet. Can you make two in a row?';})(),run:()=>{const w=winning(b,'X');if(w.length)hl(w);}},
    {q:'Where is a good place to start?',a:'The middle square gives you the most lines.'}]);}
  setAskNow();
  c.intro('You are the crosses. Get three in a row.','smile','When it ends, you can go back and try a different move.');reset();}};

window.LP.boot();
})();
</script>
