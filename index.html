<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Let's Play!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* One idea: Spark's round face is the bead of every puzzle. It is the giant cropped shape on the home screen,
   the mask of every game tile, and the bullet in the lists. Pastel fields stay pastel in dark mode;
   only the page ground and the type on it change. */
:root{
  --bg:#f7f7f5; --ink:#000; --paper:#ebebe8; --muted:#5a5a55; --accent:#d0106f; --focus:#000;
  --blue:#97aaf6; --green:#bbf697; --yellow:#fed878; --cyan:#6ef8fb;
  --field:var(--blue);
  --f-display:'Fredoka',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',ui-rounded,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121211;--ink:#f6f6f2;--paper:#242422;--muted:#b6b6b0;--focus:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121211;--ink:#f6f6f2;--paper:#242422;--muted:#b6b6b0;--focus:#fff;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:700 19px/1.45 var(--f-body);
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:20px 56px;
  -webkit-tap-highlight-color:transparent}
[data-hat="det"]{--field:var(--blue)}
[data-hat="eng"]{--field:var(--yellow)}
[data-hat="sci"]{--field:var(--green)}
[data-hat="big"]{--field:var(--cyan)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.hero :focus-visible,.stage :focus-visible,.group :focus-visible,.panel :focus-visible,.sheetbox :focus-visible,.area :focus-visible{outline-color:#000}
svg{display:block}
.wrap{width:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
/* ---- top bar ---- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{font:600 1.7rem/1 var(--f-display)}
.barr{display:flex;gap:10px;align-items:center}
.pill{position:relative;flex:none;width:56px;height:56px;border-radius:50%;border:0;padding:0;background:var(--paper);color:var(--ink);display:grid;place-items:center;transition:transform .15s}
.pill svg:not(.ringp){width:28px;height:28px}
.pill:hover{transform:scale(1.07)}
.pill[aria-pressed="false"]{opacity:.7}
.gatewrap{position:relative}
.ringp{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.gate svg:not(.ringp){width:24px;height:24px}
.gatehint{position:absolute;right:0;top:64px;white-space:nowrap;background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:14px;font-size:.95rem;z-index:5}
.gatehint:empty{display:none}
/* ---- home hero ---- */
.hero{position:relative;overflow:hidden;background:var(--blue);color:#000;border-radius:44px;min-height:clamp(540px,74vh,760px);display:flex;align-items:center;padding:clamp(24px,5vw,72px)}
.giantclip{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none}
.giant{position:absolute;right:2%;top:50%;width:min(54%,740px);aspect-ratio:1;transform:translateY(-50%);cursor:pointer;pointer-events:auto;animation:bobg 7s ease-in-out infinite}
.giant svg{width:100%;height:100%}
.heroin{position:relative;z-index:1;max-width:min(56%,620px);display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.heroin h1{font-size:clamp(2.4rem,4.4vw,4.1rem);line-height:1.04}
.hello{display:flex;align-items:center;gap:12px;background:#fff;border-radius:30px 30px 30px 8px;padding:12px 12px 12px 24px;font-size:1.25rem;max-width:100%}
.hello-text{flex:1;min-width:0}
.today{display:inline-flex;align-items:center;gap:14px;border:0;background:#fff;color:#000;border-radius:999px;padding:8px 28px 8px 8px;font:600 1.35rem/1.1 var(--f-display);text-align:left;max-width:100%}
.today-pic{flex:none;width:76px;height:76px;border-radius:50%;background:var(--yellow);display:grid;place-items:center}
.today-pic svg{width:58px;height:58px}
.bigplay{display:inline-flex;align-items:center;justify-content:center;gap:16px;min-height:92px;padding:0 48px 0 36px;background:var(--accent);color:#fff;border:0;border-radius:999px;font:600 2.4rem/1 var(--f-display);animation:pulse 2.6s ease-in-out infinite}
.bigplay svg{width:44px;height:44px}
.bigplay:hover{transform:scale(1.04)}
/* ---- the shelf of all the games ---- */
.groups{display:grid;gap:20px;grid-template-columns:1fr;scroll-margin-top:16px;outline:none}
.group{background:var(--field);color:#000;border-radius:40px;padding:clamp(18px,2.4vw,30px);display:flex;flex-direction:column;gap:18px}
.ghead{display:flex;align-items:center;gap:12px}
.ghead h2{font-size:1.8rem}
.gpic{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center}
.gpic svg{width:40px;height:40px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:16px 14px}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;color:#000;text-align:center;padding:6px;border-radius:26px;animation:rise .5s both;animation-delay:calc(var(--i)*60ms)}
.tdisc{width:100%;max-width:112px;aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;transition:transform .2s}
.tdisc svg{width:78%;height:78%}
.tile:hover .tdisc,.tile:focus-visible .tdisc{transform:scale(1.08) rotate(-4deg)}
.tname{font:600 1.1rem/1.15 var(--f-display);text-wrap:balance}
@media (min-width:1100px){
  .groups{grid-template-columns:4fr 3fr 2fr}
  .group[data-hat="det"]{grid-column:1/-1}
  .tiles{grid-template-columns:repeat(var(--n),1fr)}
}
/* ---- game screen ---- */
.gbar{display:flex;align-items:center;gap:12px}
.gbar h1,.gbar h2{flex:1;min-width:0;font-size:clamp(1.5rem,3vw,2.1rem)}
.say{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--paper);color:#000;display:grid;place-items:center;padding:0}
.say svg{width:24px;height:24px}
.say.light{color:var(--ink)}
.stage{background:var(--field);color:#000;border-radius:44px;padding:clamp(14px,2.5vw,28px);display:flex;flex-direction:column;gap:18px}
.spark{display:flex;align-items:flex-end;gap:14px}
.spark>svg{width:96px;height:106px;flex:none}
.bubble{flex:1;min-width:0;background:#fff;border-radius:30px 30px 30px 8px;padding:14px 14px 14px 24px;display:flex;gap:12px;align-items:flex-start;min-height:76px}
.bubble-text{flex:1;min-width:0;font-size:1.25rem;line-height:1.35;align-self:center}
.bubble-text .extra{display:block;margin-top:4px;color:#4a4a46;font-size:1.05rem}
.area{background:#fff;color:#000;border-radius:34px;padding:clamp(16px,2.4vw,28px);display:flex;flex-direction:column;gap:18px;min-height:280px}
.tray{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:10px 26px;border-radius:999px;border:3px solid #000;background:#000;color:#fff;font:600 1.15rem/1.1 var(--f-display);transition:transform .15s}
.btn svg{width:26px;height:26px;flex:none}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn.go{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:#fff;color:#000}
.btn.ask{background:var(--yellow);border-color:var(--yellow);color:#000}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.two .btn{flex:1;min-width:150px}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:6px 22px;border-radius:999px;border:3px solid transparent;background:var(--paper-c,#ebebe8);color:#000;font:700 1.05rem/1.2 var(--f-body);text-align:left}
.chip:hover{border-color:#000}
.chip.on,.chip[aria-pressed="true"]{background:#000;color:#fff}
.chip svg.art{flex:none}
.chip:disabled{opacity:.4;cursor:default}
.chip:disabled:hover{border-color:transparent}
.chip.no span{text-decoration:line-through}
.opt{display:inline-flex;align-items:center;gap:6px;max-width:100%}
.opt .chip{min-width:0}
.hear{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:#ebebe8;color:#000;display:grid;place-items:center;padding:0}
.hear svg{width:24px;height:24px}
.hear:hover{background:#000;color:#fff}
.ask{font:600 1.4rem/1.25 var(--f-display)}
.note{font-size:1.02rem;color:#55554f}
.center{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px}
.claim{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.claim h3{flex:1;min-width:200px;font-size:1.65rem;line-height:1.2}
.claimpics{display:flex;gap:6px}
.sheet{position:fixed;inset:0;background:rgba(10,10,10,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.sheetbox{background:#fff;color:#000;border-radius:36px;max-width:620px;width:100%;padding:24px;display:flex;flex-direction:column;gap:14px;max-height:88%;overflow:auto}
.sheetbox h3{font-size:1.55rem}
.sheetbox .opt,.sheetbox .chip{width:100%}
.sheetbox .opt .chip{flex:1}
/* ---- pieces ---- */
.shake{animation:shake .4s}
.pop,.bounce{animation:pop .35s}
.hoops{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hoop{min-height:180px;border-radius:50% / 42%;border:6px dashed #000;background:#f4f4f0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;align-content:center;padding:18px;color:#000}
.hoop.R{border-style:solid}
.hoop:hover:not(:disabled){background:#ebebe8}
.hoop:disabled{opacity:1;cursor:default}
.big-item{display:grid;place-items:center;min-height:96px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:116px;padding:8px;border:3px solid transparent;background:#ebebe8;border-radius:28px;color:#000;transition:opacity .2s,transform .2s}
.card small{font:700 .98rem/1.1 var(--f-body);color:#3d3d39}
.card.down{opacity:.25;transform:scale(.92)}
.card.sel{background:var(--field);border-color:#000}
.card.mine{border-style:dashed;border-color:#000}
.card:disabled{cursor:default}
.shelf{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.shelf .card{min-width:100px}
.train{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bead{display:inline-grid;place-items:center;padding:0;border:0;background:none;border-radius:50%;width:58px;height:58px}
.bead svg{width:100%;height:100%}
.bead.sel{outline:5px solid #000;outline-offset:2px}
.bead.pick{width:72px;height:72px}
.bead:disabled{cursor:default}
.palette{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.dotrow{display:inline-flex;gap:3px}
.who{position:relative;padding:8px;border:3px solid #ebebe8;border-radius:24px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:108px;color:#000}
.who.out>svg:first-child{opacity:.25}
.xmark{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px}
.clues{display:flex;flex-direction:column;gap:8px}
.clue{display:flex;align-items:center;gap:10px;background:#ebebe8;padding:6px 8px 6px 18px;border-radius:24px}
.clue span{flex:1;min-width:0}
.clue.new{outline:4px solid #000}
.numline{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.num{position:relative;min-width:56px;min-height:68px;border-radius:20px;border:3px solid transparent;background:#ebebe8;font:600 1.35rem/1 var(--f-display);color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px;gap:2px}
.num.out{opacity:.3}
.num.pick{background:var(--yellow);border-color:#000}
.num .mk svg{width:20px;height:20px}
.numline.guessing .num:not(.out){background:#fff;border-color:var(--accent);border-style:dashed}
.num:disabled{cursor:default}
.answer{gap:16px}
.arrowbig svg{width:44px;height:44px}
.pegs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.peg{position:relative;min-height:260px;border-radius:26px;background:#ebebe8;border:4px solid transparent;display:flex;flex-direction:column-reverse;align-items:center;gap:4px;padding:8px 4px 10px;cursor:pointer}
.peg::before{content:"";position:absolute;left:50%;top:64px;bottom:0;width:12px;margin-left:-6px;background:#b9b9b1;border-radius:6px}
.peg.sel{border-color:#000;background:var(--field)}
.goal{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:2}
.goal svg{width:46px;height:46px}
.disc{position:relative;height:34px;border-radius:17px;z-index:1;transition:transform .2s}
.disc.lift{transform:translateY(-16px)}
.river{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px}
.bank{background:#e4f6d3;border-radius:26px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;min-height:260px}
.river .water{background:#d3f3f6;border-radius:26px;padding:10px;display:flex;align-items:center}
.boatgroup{display:flex;align-items:flex-end;gap:2px;transition:margin .5s}
.boatgroup.atL{margin-right:auto}
.boatgroup.atR{margin-left:auto}
.boatgroup svg,.boatgroup .seat{width:clamp(34px,8vw,52px);height:clamp(34px,8vw,52px)}
.boatgroup svg:last-child{width:clamp(48px,11vw,72px);height:clamp(48px,11vw,72px)}
.boatgroup .seat{display:block}
.who-btn{min-width:68px;min-height:68px;border-radius:22px;border:3px solid transparent;background:#fff;padding:4px;display:grid;place-items:center;color:#000}
.who-btn.on{border-color:#000;background:var(--yellow)}
.who-btn:disabled{opacity:.5;cursor:default}
.grid{display:grid;gap:6px;justify-content:center}
.cell{width:74px;height:74px;border-radius:18px;background:#ebebe8;display:grid;place-items:center;position:relative}
.cell.rock{background:#d6d6d0}
.cell.here{outline:5px solid #000}
.robo{display:grid;transition:transform .25s}
.prog{display:flex;gap:8px;flex-wrap:wrap;min-height:76px;padding:10px;border:4px dashed #b9b9b1;border-radius:24px;align-items:center}
.pc{position:relative;min-width:58px;min-height:58px;border-radius:20px;border:3px solid #000;background:var(--field);color:#000;padding:0;display:grid;place-items:center}
.pc svg{width:34px;height:34px}
.pc.sel{background:#000;color:#fff}
.pc.bad{outline:5px solid var(--accent);outline-offset:2px}
.pc:disabled{cursor:default}
.bump{position:absolute;right:-8px;top:-10px}
.bump svg{width:24px;height:24px}
.opts{display:flex;gap:12px;flex-wrap:wrap}
.opts .btn{flex:1;min-width:120px}
.tank{position:relative;height:190px;border-radius:26px;background:#eef3f5;overflow:hidden}
.tank .water{position:absolute;left:0;right:0;bottom:0;height:68%;background:#9be9ee}
.tank .thing{position:absolute;left:50%;top:10px;margin-left:-32px;transition:top 1.2s ease-in}
.tank.sink .thing{top:112px}
.tank.float .thing{top:52px;animation:bob 1.6s ease-in-out 1.2s infinite}
.log{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.logitem{display:inline-flex;flex-direction:column;align-items:center}
.logitem small{font-size:.8rem;font-weight:700;color:#55554f}
.puppets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pup{border:3px solid #ebebe8;border-radius:26px;padding:12px;text-align:center;min-height:130px;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff}
.pup.right{border-color:#000;background:#eaf7dc}
.pup.wrong{background:#f1f1ed}
.ans{display:inline-flex;align-items:center;gap:8px}
.verdict{display:inline-flex;align-items:center;gap:6px}
.tallyrow{display:flex;gap:24px;flex-wrap:wrap}
.tally{display:flex;align-items:center;gap:8px}
.tl{display:inline-flex;gap:3px}
.sr{position:absolute;left:-9999px}
.board{display:grid;grid-template-columns:repeat(3,92px);gap:8px;justify-content:center}
.sq{width:92px;height:92px;border-radius:24px;border:3px solid transparent;background:#ebebe8;padding:0;display:grid;place-items:center}
.sq svg{width:54px;height:54px}
.sq.flash{outline:6px solid #000;outline-offset:2px;background:var(--yellow)}
.sq:disabled{cursor:default}
.stones{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btn.take{flex-direction:column;gap:6px;padding:10px 22px}
.mini{display:inline-flex;gap:2px}
.mini svg{width:26px;height:26px}
.report{display:flex;flex-direction:column;gap:8px}
.report p{display:flex;gap:12px;align-items:center;font-size:1.25rem}
.dotpic{flex:none;width:16px;height:16px;border-radius:50%;background:var(--accent)}
.rpic{position:relative;display:inline-grid}
.rpic .neg{position:absolute;right:-8px;bottom:-8px}
.thumb{display:inline-block}
/* ---- grown-ups ---- */
.adult .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:20px}
.panel{background:var(--field);color:#000;border-radius:40px;padding:clamp(18px,2.4vw,30px);display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.wide{grid-column:1/-1}
.panel:nth-child(1){--field:var(--blue)}
.panel:nth-child(2){--field:var(--green)}
.panel:nth-child(3){--field:var(--yellow)}
.panel:nth-child(4){--field:var(--cyan)}
.panel h2{font-size:1.7rem}
.panel h3{font-size:1.25rem;margin-top:6px}
.lead{font-size:1.15rem;max-width:62ch}
.lvrow{display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:24px;padding:12px 16px}
.lvname{display:flex;align-items:center;gap:10px;font:600 1.15rem/1.1 var(--f-display)}
.notes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
details.grown{background:#fff;border-radius:24px;padding:6px 18px 12px}
details.grown summary{display:flex;align-items:center;gap:10px;font:600 1.15rem/1.1 var(--f-display);cursor:pointer;min-height:52px}
details.grown p{margin-top:8px;font-weight:600;font-size:1rem}
.hgrid{display:grid;gap:10px}
.entry{background:#fff;border-radius:20px;padding:10px 16px}
.entry small{color:#55554f;font-weight:700}
.prose{font-weight:600}
.prose p{max-width:68ch}
.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;max-width:68ch}
/* ---- motion ---- */
.sparkface .eyes{transform-box:fill-box;transform-origin:center;transition:transform .09s}
.sparkface .eyes.blink{transform:scaleY(.08)}
.sparkface .look{transition:transform .14s ease-out}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes bobg{50%{transform:translateY(calc(-50% - 12px))}}
@keyframes pulse{50%{transform:scale(1.045)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@media (max-width:760px){
  body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hero{flex-direction:column;align-items:stretch;padding:0 20px 28px;min-height:0;border-radius:36px}
  .giantclip{position:relative;inset:auto;overflow:hidden;margin:0 -20px;height:min(62vw,300px)}
  .giant{position:absolute;right:4%;top:2%;transform:none;width:88%;animation:none}
  .heroin{max-width:100%;align-items:stretch}
  .heroin h1{font-size:2.2rem}
  .bigplay{width:100%;min-height:84px;font-size:2.2rem}
  .row .btn{flex:1;min-width:140px}
  .gbar h2,.gbar h1{flex:1 1 100%;order:3}
  .spark>svg{width:72px;height:80px}
  .board{grid-template-columns:repeat(3,80px)}
  .sq{width:80px;height:80px}
  .cell{width:60px;height:60px}
  .peg{min-height:220px}
  .hoop{min-height:150px;padding:12px}
  .stage{border-radius:32px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="app"></div>
<script>

/* ---------- colours with textures: never colour alone ---------- */

const TEXDEFS='<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>'+
 '<pattern id="tx-red" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#e0454b"/><circle cx="5" cy="5" r="2" fill="#fff" opacity=".75"/></pattern>'+
 '<pattern id="tx-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#4c6fe0"/><rect width="3.2" height="9" fill="#fff" opacity=".5"/></pattern>'+

 '<pattern id="tx-green" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#44ad5f"/><path d="M0 5H10M5 0V10" stroke="#fff" stroke-width="1.8" opacity=".55"/></pattern>'+
 '</defs></svg>';

  px=px||56;const s=svg('svg',{viewBox:'0 0 60 60',width:px,height:px,'aria-hidden':'true',focusable:'false'});

/* ---------- Spark: a round face. The same face is the giant shape on the home screen ---------- */
function faceMarkup(cx,cy,k){const X=v=>+(cx+v*k).toFixed(2),Y=v=>+(cy+v*k).toFixed(2);
  return '<g class="eyes"><circle cx="'+X(-14)+'" cy="'+Y(-6)+'" r="'+10*k+'" fill="#fff"/><circle cx="'+X(14)+'" cy="'+Y(-6)+'" r="'+10*k+'" fill="#fff"/>'+
   '<g class="look"><circle class="pl" cx="'+X(-13)+'" cy="'+Y(-4)+'" r="'+5*k+'" fill="#000"/><circle class="pr" cx="'+X(15)+'" cy="'+Y(-4)+'" r="'+5*k+'" fill="#000"/></g></g>'+
   '<circle cx="'+X(-26)+'" cy="'+Y(10)+'" r="'+6*k+'" fill="#f7a6c3"/><circle cx="'+X(26)+'" cy="'+Y(10)+'" r="'+6*k+'" fill="#f7a6c3"/>'+
   '<path class="mouth" d="'+mouthD('smile',cx,cy,k)+'" fill="none" stroke="#000" stroke-width="'+4.5*k+'" stroke-linecap="round" stroke-linejoin="round"/>';}

  if(m==='wow')return 'M'+X(-6)+' '+Y(14)+' Q'+X(0)+' '+Y(30)+' '+X(6)+' '+Y(14)+' Q'+X(0)+' '+Y(10)+' '+X(-6)+' '+Y(14)+'Z';
  if(m==='hmm'||m==='think')return 'M'+X(-8)+' '+Y(19)+' Q'+X(0)+' '+Y(15)+' '+X(8)+' '+Y(19);
  return 'M'+X(-10)+' '+Y(14)+' Q'+X(0)+' '+Y(25)+' '+X(10)+' '+Y(14);}

function setMood(s,m){if(!s)return;const mo=$('.mouth',s),pl=$('.pl',s),pr=$('.pr',s);if(!mo)return;

  (function go(){if(!alive||!s.isConnected)return;setTimeout(()=>{if(!s.isConnected)return;eyes.classList.add('blink');setTimeout(()=>{eyes.classList.remove('blink');go();},120);},2500+rnd(2600));})();
  return ()=>{alive=false;};}
function lookAround(s,host){const lk=$('.look',s);if(!lk||reduced())return null;
  const k=+s.dataset.k;let raf=0,px=0,py=0;
  const on=e=>{const b=s.getBoundingClientRect();const dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2);const d=Math.hypot(dx,dy)||1;const m=Math.min(1,d/220);
    px=dx/d*m*5*k;py=dy/d*m*4*k;if(!raf)raf=requestAnimationFrame(()=>{raf=0;lk.style.transform='translate('+px.toFixed(1)+'px,'+py.toFixed(1)+'px)';});};
  host.addEventListener('pointermove',on);host.addEventListener('pointerdown',on);return ()=>{host.removeEventListener('pointermove',on);host.removeEventListener('pointerdown',on);};}

/* ---------- speech ---------- */
const App={voice:store.get('voice',true),cleanup:null,sess:null,today:null};
/* Recorded voice: Google Chirp 3 HD "Achernar" (same narrator as the Little Scientists Club films).
   Every sentence Spark can say is a clip in audio/voice.bin. A line with any unrecorded sentence
   falls back to the browser voice. Sentence rules match scripts/voice/text.mjs in the Munchkin project. */
const EMOJI=/[\u{1F300}-\u{1FAFF}☀-➿]|️|‍/gu;
function sentences(text){const t=String(text).replace(EMOJI,'').replace(/\s+/g,' ').trim();if(!t)return [];
  return t.replace(/([.!?])\s+(?=\S)/g,'$1\n').split('\n').map(x=>x.trim()).filter(Boolean);}
const keyOf=s=>s.toLowerCase().replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
const clips=new Map();let packP=null,actx=null,curSrc=null,tok=0;
function loadPack(){if(packP)return packP;
  packP=fetch('audio/voice.bin').then(r=>r.ok?r.arrayBuffer():null).then(buf=>{if(!buf)return;
    const n=new DataView(buf).getUint32(0,true);const head=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,n)));
    for(const k in head.clips){const c=head.clips[k];clips.set(k,{buf,at:4+n+c[0],len:c[1]});}}).catch(()=>{});return packP;}
function browserSpeak(t){try{const s=window.speechSynthesis;if(!s)return;s.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;u.pitch=1.15;s.speak(u);}catch(e){}}
async function speak(t){if(!App.voice)return;const my=++tok;stopAudio();const ss=sentences(t);if(!ss.length)return;
  await loadPack();if(my!==tok)return;
  if(ss.every(x=>clips.has(keyOf(x)))){
    try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')await actx.resume();
      for(const x of ss){if(my!==tok)return;const c=clips.get(keyOf(x));const ab=c.buf.slice(c.at,c.at+c.len);
        const buf=await actx.decodeAudioData(ab);if(my!==tok)return;
        await new Promise(res=>{const src=actx.createBufferSource();src.buffer=buf;src.connect(actx.destination);curSrc=src;src.onended=res;src.start();});}
      return;}catch(e){}}
  if(my===tok)browserSpeak(t);}
function stopAudio(){try{if(curSrc){curSrc.onended=null;curSrc.stop();}}catch(e){}curSrc=null;try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}}

const root=$('#app');

    App.voice?ICON.speaker():ICON.mute());return b;}
function holdBtn(onOpen){
  const ring=svg('svg',{viewBox:'0 0 48 48',class:'ringp','aria-hidden':'true',focusable:'false'});
  ring.innerHTML='<circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="4" opacity=".22"/><circle class="arc" cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="132" stroke-dashoffset="132" transform="rotate(-90 24 24)"/>';
  const arc=$('.arc',ring);let on=false,raf=0,t0=0;
  const hint=h('span',{class:'gatehint',role:'status'});
  const b=h('button',{class:'pill gate',type:'button','aria-label':'For grown-ups. Press and hold for two seconds.'},ring,ICON.lock());
  const wrap=h('span',{class:'gatewrap'},b,hint);
  function stop(showHint){cancelAnimationFrame(raf);const short=on&&performance.now()-t0<1900;on=false;arc.setAttribute('stroke-dashoffset',132);
    if(short&&showHint){hint.textContent='Hold for two seconds';clearTimeout(stop.t);stop.t=setTimeout(()=>hint.textContent='',2200);}}
  function start(){if(on)return;on=true;t0=performance.now();
    (function tick(){if(!on)return;const k=Math.min(1,(performance.now()-t0)/2000);arc.setAttribute('stroke-dashoffset',132*(1-k));
      if(k>=1){on=false;arc.setAttribute('stroke-dashoffset',132);onOpen();return;}raf=requestAnimationFrame(tick);})();}

      const opts=new Map([[rule.name,rule]]);while(opts.size<6){const r=pick(all);opts.set(r.name,r);}
      c.area.append(h('p',{class:'ask'},'What is the secret rule?'),
        h('div',{class:'chips'},shuffle([...opts.values()]).map(r=>chip(r.name,()=>{
          if(r===rule){won=true;c.setAsk(null);c.fx('solved','Yes! The rule is '+rule.name+'.');
            c.area.replaceChildren(h('p',{class:'ask'},'You found it: '+rule.name+'.'),h('div',{class:'hoops'},['L','R'].map(s=>h('div',{class:'hoop'},placed[s].map(itemEl)))),btn('Tell Spark how it went','go',()=>c.finish(),'tick'));}
          else{wrongGuess.add(r.name);c.fx('retry','Not that one. Look at the hoops again. What is the same?');render();}
        },{pic:rulePic(r.pi),disabled:wrongGuess.has(r.name),cls:wrongGuess.has(r.name)?'no':''}))),
        btn('Back to the hoops','ghost',()=>{guessing=false;render();},'back'));return;}
    const cur=items[idx];
    c.area.append(
      cur?h('div',{class:'big-item'},itemEl(cur)):h('p',{class:'ask'},'No more things. Time to guess the rule!'),
      h('div',{class:'hoops'},['L','R'].map(s=>h('button',{class:'hoop '+s,type:'button','aria-label':'Put it in the '+(s==='L'?'left':'right')+' hoop',onclick:()=>choose(s),disabled:!cur},placed[s].map(itemEl)))),
      h('div',{class:'chips'},['colour','shape','size'].map(f=>chip('Is it about '+f+'?',()=>{asked[f]=true;
        const yes=rule.f.includes(f);c.fx('question',yes?'Yes, the rule is about '+f+'.':'No, the rule is not about '+f+'.');render();},{pic:featPic(f),disabled:!!asked[f]}))),
      btn('I think I know the rule!','go',()=>{guessing=true;render();c.say('What is the secret rule? Pick one.','think');},'ask'));
  }
  function choose(s){const cur=items[idx];if(!cur)return;const truth=side(cur);placed[truth].push(cur);idx++;
    if(s===truth)c.fx('predict','It went where you thought. What made you think so?');
    else c.fx('predict','Surprise! It went the other way. That is a clue. What is different about it?');
    render();}
  c.setAsk(()=>(!won&&!guessing&&idx<items.length)?[{q:'Can you show me one more?',a:'Here is the next one, placed for you.',run:()=>{const cur=items[idx];if(!cur||won)return;placed[side(cur)].push(cur);idx++;render();}}]:[]);
  c.intro('Where does this one go? Guess first, then watch. Then find the secret rule.','think');
  render();}};

const ANIMALS=[
 {pic:'elephant',n:'elephant',fur:0,feathers:0,fly:0,water:0,four:1,big:1,pat:0,meat:0},
 {pic:'tiger',n:'tiger',fur:1,feathers:0,fly:0,water:0,four:1,big:1,pat:1,meat:1},
 {pic:'rabbit',n:'rabbit',fur:1,feathers:0,fly:0,water:0,four:1,big:0,pat:0,meat:0},
 {pic:'parrot',n:'parrot',fur:0,feathers:1,fly:1,water:0,four:0,big:0,pat:0,meat:0},
 {pic:'crocodile',n:'crocodile',fur:0,feathers:0,fly:0,water:1,four:1,big:1,pat:0,meat:1},
 {pic:'shark',n:'shark',fur:0,feathers:0,fly:0,water:1,four:0,big:1,pat:0,meat:1},
 {pic:'fish',n:'fish',fur:0,feathers:0,fly:0,water:1,four:0,big:0,pat:1,meat:0},
 {pic:'butterfly',n:'butterfly',fur:0,feathers:0,fly:1,water:0,four:0,big:0,pat:1,meat:0},
 {pic:'lion',n:'lion',fur:1,feathers:0,fly:0,water:0,four:1,big:1,pat:0,meat:1},
 {pic:'zebra',n:'zebra',fur:1,feathers:0,fly:0,water:0,four:1,big:1,pat:1,meat:0}];
const AQ={fur:'Is it covered in fur?',feathers:'Does it have feathers?',fly:'Can it fly?',water:'Does it live in water?',four:'Does it have four legs?',big:'Is it bigger than a dog?',pat:'Does it have stripes or spots?',meat:'Does it eat meat?'};
GAMES.animal={title:'Guess My Animal',hat:'det',tile:'t_animal',blurb:'Ask yes or no questions. Find the secret animal.',
 levels:['8 animals','10 animals'],
 grown:{skill:'Asking questions that split a set in two; using answers to rule things out.',ask:'Which question helped you most? Is there a question that takes out lots of animals at once?',praise:'"That question took out lots of animals." "You asked before you guessed."'},
 init(c){
  const set=ANIMALS.slice(0,c.level===1?8:10);
  let mode='ask',secret=pick(set),alive=new Set(set.map((_,i)=>i)),asked=[],sel=null,found=false,q=null;
  const feats=Object.keys(AQ);
  const h2=n=>(n===1?'1 question':n+' questions');
  function reset(m){q=null;mode=m;alive=new Set(set.map((_,i)=>i));asked=[];sel=null;found=false;if(m==='ask')secret=pick(set);render();}
  const cards=(clickable,onpick)=>h('div',{class:'cards'},set.map((a,i)=>{const out=!alive.has(i);
    return h('button',{class:'card'+(out?' down':'')+(sel===i?' sel':''),type:'button',disabled:!clickable||out,'aria-label':a.n+(out?', ruled out':''),
      onclick:()=>onpick?onpick(i):(sel=i,render())},art(a.pic,64),h('small',null,a.n));}));
  function render(){
    c.area.replaceChildren();
    if(mode==='ask'){
      if(found){c.area.append(h('p',{class:'ask'},'You found the '+secret.n+'! Which question helped you most?'),
        h('div',{class:'chips'},asked.map(a=>chip(AQ[a.f]+' (took out '+a.removed+')',()=>c.reason(a.f,'Yes, that one took out '+a.removed+'.'),{pic:art(a.f,40)}))),
        h('div',{class:'tray'},btn('Now you hide one','go',()=>{mode='swap';secret=null;sel=null;alive=new Set(set.map((_,i)=>i));asked=[];found=false;c.say('Your turn! Tap the animal you are hiding. Then I will ask questions.','smile');render();},'swap'),btn('Tell Spark how it went','ghost',()=>c.finish(),'tick')));return;}
      c.area.append(cards(true),
        sel!=null&&alive.has(sel)?btn('It is the '+set[sel].n+'!','go',()=>guess(sel),'tick'):h('p',{class:'note'},'Ask a question, or tap an animal to guess.'),
        h('div',{class:'chips'},feats.map(f=>chip(AQ[f],()=>ask(f),{pic:art(f,40),disabled:asked.some(x=>x.f===f)}))));
    }else{
      if(secret==null){c.area.replaceChildren(h('p',{class:'ask'},'Tap the animal you are hiding.'),cards(true,i=>{secret=set[i];sel=-1;c.say('I will ask questions. Answer yes or no.','think');spark();}));return;}
      spark();}
  }
  function spark(){
    c.area.replaceChildren();
    const left=[...alive];
    if(left.length===1&&!q){q={guess:left[0]};}
    if(left.length===0){c.area.append(h('p',{class:'ask'},'Hmm, no animals are left. Maybe an answer got mixed up. Shall we start again?'),btn('Start again','go',()=>reset('swap'),'replay'));secret=null;return;}
    if(!q){let best=null,bs=99;for(const f of feats){if(asked.some(x=>x.f===f))continue;const y=left.filter(i=>set[i][f]).length;if(y===0||y===left.length)continue;const s=Math.abs(y-left.length/2);if(s<bs){bs=s;best=f;}}
      if(best==null){c.area.append(h('p',{class:'ask'},'I cannot tell them apart with my questions. Which animal is it?'),h('div',{class:'chips'},left.map(i=>chip(set[i].n,()=>{q={guess:i};spark();},{pic:set[i].pic}))));return;}
      q={f:best};}
    if(q.guess!=null){const a=set[q.guess];
      c.area.append(cards(false),h('p',{class:'ask'},'Is it the '+a.n+'?'),h('div',{class:'opts'},
        btn('Yes!','go',()=>{c.fx('solved','I found it after '+h2(asked.length)+'. Thank you for helping me think!');c.area.replaceChildren(h('p',{class:'ask'},'Spark found your '+a.n+' with '+h2(asked.length)+'.'),h('div',{class:'tray'},btn('Tell Spark how it went','go',()=>c.finish(),'tick'),btn('Play again','ghost',()=>{q=null;reset('ask');},'replay')));},'tick'),
        btn('No','ghost',()=>{alive.delete(q.guess);q=null;c.say('Oh. Let me think again.','hmm');spark();},'cross')));
      return;}
    c.area.append(cards(false),h('p',{class:'ask'},AQ[q.f]+' (about your animal)'),h('div',{class:'center'},art(q.f,64)),h('div',{class:'opts'},
      btn('Yes','go',()=>answer(1),'tick'),btn('No','ghost',()=>answer(0),'cross')));
    c.say(AQ[q.f],'think');
  }
  function answer(v){const truth=secret[q.f]?1:0;
    if(v!==truth){c.say('Hmm, check your animal. '+AQ[q.f],'hmm');const f=c.area.firstChild;f&&f.classList.add('shake');return;}
    const before=alive.size;for(const i of [...alive])if((set[i][q.f]?1:0)!==v)alive.delete(i);
    asked.push({f:q.f,removed:before-alive.size});q=null;spark();}
  function ask(f){const yes=!!secret[f];const before=alive.size;
    for(const i of [...alive])if(!!set[i][f]!==yes)alive.delete(i);
    const removed=before-alive.size;asked.push({f,removed});
    c.fx('question',(yes?'Yes. ':'No. ')+(removed?'That took out '+removed+(removed===1?' animal.':' animals.'):'That did not take any out, but now we know something.')+(alive.size===1?' Only one animal is still up!':''));render();}
  function guess(i){if(set[i]===secret){found=true;c.fx('solved','It was the '+secret.n+'!');render();}
    else{alive.delete(i);sel=null;c.fx('retry','Not the '+set[i].n+'. Look at the animals still up. What could you ask?');render();}}
  c.setAsk(()=>mode==='ask'&&!found?[{q:'Which question is a good one to start with?',a:'A good question takes out about half the animals. Think about what half of them have.'},
    {q:'How many animals are still up?',a:alive.size===1?'1 animal is still up.':alive.size+' animals are still up.'}]:[]);
  c.intro('I am hiding an animal. Ask yes or no questions to find it.','smile');render();}};

 {l:1,items:[{n:'bike',pic:'bike',r:'it has two wheels'},{n:'car',pic:'car',r:null},{n:'bus',pic:'bus',r:'it stops at bus stops'},{n:'plane',pic:'plane',r:'it flies'}],decoy:'it is yellow'},
 {l:1,items:[{n:'red circle',s:['circle','red'],r:null},{n:'red square',s:['square','red'],r:'it has four corners'},{n:'red triangle',s:['triangle','red'],r:'it has three corners'},{n:'blue circle',s:['circle','blue'],r:'it is blue'}],decoy:'it is small'},

GAMES.odd={title:'Odd One Out',hat:'det',tile:'t_odd',blurb:'Which one does not belong? Say why.',
 levels:['Easy sets','More sets'],
 grown:{skill:'Seeing that one thing can group in different ways; giving a reason.',ask:'Can you find a different one that is odd? What is the reason this time?',praise:'"You found a second answer." "You gave a reason, not just a pick."'},
 init(c){

  const node=it=>it.pic?art(it.pic,72):shapeSVG(it.s[0],it.s[1],64);

      onclick:()=>{if(lastPick!=null&&lastPick!==i)c.fx('change');lastPick=i;chosen=i;
        if(it.r==null){c.fx('retry','Is there something only the '+it.n+' has? Look again, or pick another.');chosen=null;render();return;}
        c.say('Why '+isAre(it)+' the '+it.n+' odd?','think');render();}},node(it),h('small',null,it.n)))));
    if(chosen!=null){const it=S.items[chosen];const rs=shuffle([...S.items.map(x=>x.r).filter(Boolean),S.decoy]);
      c.area.append(h('p',{class:'ask'},'Why '+isAre(it)+' the '+it.n+' odd?'),h('div',{class:'chips'},rs.map(r=>chip(r,()=>{
        if(r===it.r){found.add(chosen);c.fx('explain','Yes! The '+it.n+' '+isAre(it)+' odd because '+r+'.');chosen=null;render();
          c.area.append(found.size<S.items.filter(x=>x.r).length?h('p',{class:'note'},'Can you find a different one that is odd?'):h('p',{class:'note'},'You found every reason!'));}
        else{const other=S.items.find(x=>x.r===r);c.fx('retry',other?'That is true for the '+other.n+'. Does that fit the '+it.n+'?':'Is that true for any of them? Look again.');}}))));}
    else if(found.size)c.area.append(h('p',{class:'note'},'Found '+found.size+(found.size===1?' answer':' answers')+' in this set.'));
    c.area.append(h('div',{class:'tray'},btn(si<sets.length-1?'Next set':'Finish','ghost',()=>{if(si<sets.length-1){si++;chosen=null;found=new Set();lastPick=null;render();c.say('Which one does not belong?','smile');}else c.finish();},'play')));
  }
  c.setAsk(()=>[{q:'What can I look at?',a:'Look at colour, shape, what it does, and where it lives or grows.'},

/* ===== Pattern Train ===== */
GAMES.pattern={title:'Pattern Train',hat:'det',tile:'t_pattern',blurb:'Carry on the pattern. Spot the mistake. Make your own.',
 levels:['Short patterns','Longer patterns','Make your own'],
 grown:{skill:'Seeing the repeating unit; noticing what breaks a rule; making a rule for someone else.',ask:'Can you say the rule out loud? What comes after red? How will I know your rule?',praise:'"You said the rule." "You spotted where it broke." "You made a puzzle for me."'},
 init(c){
  let round=0,mode,seq,shown,fill,fixAt,selBead,expected,solved=false,ruleOpts=null;
  const period=s=>{for(let p=1;p<=Math.floor(s.length/2);p++){if(s.every((x,i)=>x===s[i%p]))return p;}return 0;};
  const train=(arr,selIdx)=>h('div',{class:'train'},arr.map((cn,i)=>h('span',{class:'bead'+(i===selIdx?' sel':'')},beadSVG(cn,52))));
  const pal=fn=>h('div',{class:'palette'},CNAME.map(cn=>h('button',{class:'bead pick',type:'button','aria-label':cn,onclick:()=>fn(cn)},beadSVG(cn,60))));
  const tap=(cn,sel,fn,locked)=>h('button',{class:'bead'+(sel?' sel':''),type:'button','aria-label':cn||'empty',disabled:locked||!fn,onclick:fn},beadSVG(cn,52));
  const validFix=(j,cn)=>{if(cn===seq[j])return false;const t=seq.slice();t[j]=cn;return !!period(t);};
  function newRound(){
    round++;solved=false;ruleOpts=null;
    if(c.level===3){mode='make';seq=[];render();return;}
    const units=c.level===1?['AB']:['AAB','ABC','ABB','AABB'];
    const u=pick(units),cols=shuffle(CNAME),map={};[...new Set(u)].forEach((ch,i)=>map[ch]=cols[i]);
    const unit=[...u].map(ch=>map[ch]);const len=u.length<3?8:u.length===3?9:10;
    seq=Array.from({length:len},(_,i)=>unit[i%unit.length]);seq.unit=unit;
    mode=round%2?'cont':'fix';
    if(mode==='cont'){shown=len-2;fill=[];}
    else{const base=seq.slice();let tries=0,ok=false,best=null;
      while(!ok&&tries++<80){fixAt=2+rnd(len-3);const wrong=pick(CNAME.filter(x=>x!==base[fixAt]));expected=base[fixAt];seq=base.slice();seq.unit=unit;seq[fixAt]=wrong;
        let fixes=0;for(let j=0;j<len;j++)for(const cn of CNAME)if(validFix(j,cn))fixes++;
        if(fixes===1)ok=true;else if(!best||fixes<best.f)best={f:fixes,at:fixAt,w:wrong,e:expected};}
      selBead=null;}
    render();
  }
  function ruleChip(s,done){return chip(null,()=>{
      if(solved)return;
      if(s.join()===seq.unit.concat(seq.unit).join()){solved=true;c.fx('solved','Yes! That pattern repeats again and again.');render();}
      else c.fx('retry','Look at the train again. What repeats?');},{pic:h('span',{class:'dotrow'},s.map(cn=>beadSVG(cn,34))),hear:false,disabled:solved});}
  function ruleBox(){const u=seq.unit;
    if(!ruleOpts){const opts=new Map();opts.set(u.concat(u).join(),u.concat(u));
      const rots=new Set(u.map((_,k)=>u.slice(k).concat(u.slice(0,k)).join()));let g=0;while(opts.size<3&&g++<200){const r=Array.from({length:u.length},()=>pick(CNAME));if(rots.has(r.join()))continue;const s=r.concat(r);opts.set(s.join(),s);}
      ruleOpts=shuffle([...opts.values()]);}
    return h('div',null,h('p',{class:'ask'},'What is the rule? Pick the one that matches.'),h('div',{class:'chips'},ruleOpts.map(s=>ruleChip(s))));}
  function render(){
    c.area.replaceChildren();
    if(mode==='cont'){
      const cells=seq.map((cn,i)=>i<shown?cn:i-shown<fill.length?fill[i-shown]:null);
      c.area.append(train(cells));
      if(fill.length<2)c.area.append(h('p',{class:'ask'},'What comes next?'),pal(cn=>{
        const want=seq[shown+fill.length];
        if(cn===want){fill.push(cn);if(fill.length===2){c.count('try');render();c.say('The train is full! Now, what is the rule?','wow');}else{c.fx('try');render();}}
        else{c.fx('retry','Look at the beads before. What comes after the '+seq[shown+fill.length-1]+' one?');const t=c.area.querySelector('.train');t&&t.classList.add('shake');}}));
      else{c.area.append(ruleBox());if(solved)c.area.append(btn('Next train','go',newRound,'play'));}
    }else if(mode==='fix'){
      c.area.append(h('div',{class:'train'},seq.map((cn,i)=>tap(cn,selBead===i,()=>{if(solved)return;if(selBead!=null&&selBead!==i)c.fx('change');selBead=i;render();},solved))));
      if(solved)c.area.append(btn('Next train','go',newRound,'play'));
      else if(selBead==null)c.area.append(h('p',{class:'ask'},'One bead breaks the pattern. Tap it.'));
      else c.area.append(h('p',{class:'ask'},'What colour should it be?'),pal(cn=>{
        if(validFix(selBead,cn)){seq[selBead]=cn;solved=true;selBead=null;c.fx('solved','You spotted the mistake and fixed it!');render();}
        else if(!CNAME.some(x=>validFix(selBead,x))){c.fx('retry','That bead fits the pattern. Look for where the pattern breaks.');selBead=null;render();}
        else c.fx('retry','Not that colour. What should come here so the pattern repeats?');}));
    }else{
      c.area.append(h('p',{class:'ask'},'Make a pattern with up to 8 beads. Then ask Spark what comes next.'),
        h('div',{class:'train'},seq.length?seq.map(cn=>h('span',{class:'bead'},beadSVG(cn,52))):[h('span',{class:'bead'},beadSVG(null,52))]),
        pal(cn=>{if(seq.length<8){seq.push(cn);c.fx('try');render();}}),
        h('div',{class:'tray'},btn('Go back one','ghost',()=>{if(seq.length){seq.pop();c.fx('change');}render();},'undo'),btn('Spark, what comes next?','go',spark,'ask')));
    }
  }
  function again(msg,extra){c.area.replaceChildren(...extra,btn('Make another','go',()=>{seq=[];render();},'replay'));}
  function spark(){
    if(seq.length<4){c.say('Add a few more beads so I can see your pattern.','hmm');return;}
    const p=period(seq);c.fx('create');
    if(p){const nx=seq[seq.length%p];c.area.replaceChildren(train(seq.concat([nx]),seq.length),
      h('p',{class:'ask'},'I think the next bead is '+nx+'. Did I get it?'),h('div',{class:'opts'},btn('Yes!','go',()=>{c.say('I followed your rule. Great puzzle!','wow');again(null,[train(seq.concat([nx])),h('p',{class:'ask'},'Spark followed your rule.')]);},'tick'),
        btn('No','ghost',()=>{c.say('Oh! Tell me your rule. Tap the bead that should come next.','think');c.area.replaceChildren(train(seq),pal(cn=>{c.reason('rule','Thank you. Now I see your rule.');again(null,[train(seq.concat([cn])),h('p',{class:'ask'},'Thank you for showing me.')]);}));},'cross')));}
    else{c.say('I cannot see a rule yet. Tap the bead that should come next.','hmm');c.area.replaceChildren(train(seq),pal(cn=>{c.reason('rule','Thank you. You are the puzzle maker.');again(null,[train(seq.concat([cn])),h('p',{class:'ask'},'Thank you for showing me.')]);}));}
  }
  c.setAsk(()=>[{q:'What should I look at?',a:'Look at the beads one by one. Say them out loud. Does a group repeat?'},
    {q:'How long is the repeating part?',a:mode==='make'?'Your pattern can repeat any group you like. Try 2 or 3 beads, then repeat it.':'Find the first bead again. Count the beads before it comes back.'}]);
  c.intro(c.level===3?'Make a pattern. I will try to guess it.':'Look at the pattern. Say it out loud.','smile');newRound();}};

GAMES.mango={title:'Who Ate the Mango?',hat:'det',tile:'t_mango',blurb:'Ask for clues. Cross out who it cannot be.',

  c.setAsk(()=>over?[]:[{q:'What does the mango eater look like?',a:'You will have to ask me about hats, glasses or shirts. Which one first?'},

GAMES.number={title:'Guess the Number',hat:'det',tile:'t_number',blurb:'Tap a number to ask "is it bigger than...?" and find the secret one.',

 grown:{skill:'Choosing a question that narrows the range most; keeping track of what is left.',ask:'What is a good first question? Why does a question in the middle help?',praise:'"That question cut the numbers in half." "You kept track of what was left."'},
 init(c){
  const N=c.level===1?10:20;const secret=1+rnd(N);let lo=1,hi=N,guessing=false,over=false,last=null;const bad=new Set(),qs=[],marks=new Map();
  function render(){

      last&&!guessing?h('div',{class:'center answer'},art(last.yes?'tick':'cross',48),h('span',{class:'arrowbig'},last.yes?ICON.up():ICON.down())):null,
      h('div',{class:'numline'+(guessing?' guessing':'')},Array.from({length:N},(_,i)=>i+1).map(n=>{
        const m=marks.get(n);const outr=n<lo||n>hi||bad.has(n);
        return h('button',{class:'num'+(outr?' out':'')+(last&&last.n===n&&!guessing?' pick':''),type:'button','aria-label':String(n)+(m?(m==='up'?', secret is higher':', secret is this or lower'):'')+(outr?', ruled out':''),disabled:over||bad.has(n),onclick:()=>guessing?guess(n):ask(n)},
          h('span',null,n),m&&!guessing?h('span',{class:'mk'},m==='up'?ICON.up():ICON.down()):null);})),
      over?null:guessing?btn('Back to asking','ghost',()=>{guessing=false;render();c.say('Tap a number to ask me.','smile');},'back'):
      btn('I know it!','go',()=>{guessing=true;render();c.say('Tap the number you think it is.','think');},'ask'));}
  function ask(n){const yes=secret>n;const width=hi-lo+1;
    if(yes)lo=Math.max(lo,n+1);else hi=Math.min(hi,n);const nw=hi-lo+1;qs.push(n);marks.set(n,yes?'up':'down');last={n,yes};
    const mid=Math.abs(nw-width/2)<=1.5;
    c.fx('question',(yes?'Yes, it is bigger than '+n+'. ':'No, it is '+n+' or smaller. ')+(mid&&width>3?'That question cut the numbers in half!':'Look at which numbers are left.'));render();}
  function guess(n){if(n===secret){over=true;c.fx('solved','It was '+n+'! You found it after '+(qs.length===1?'1 question':qs.length+' questions')+'.');
      c.area.replaceChildren(h('p',{class:'ask'},'You found '+n+' after '+(qs.length===1?'1 question':qs.length+' questions')+'.'),btn('Tell Spark how it went','go',()=>c.finish(),'tick'));}
    else{bad.add(n);c.fx('retry','Not '+n+'. Look at the numbers that are left.');render();}}

    {q:'Which numbers are still possible?',a:'Look at the numbers that are not faded.'}]);

<script>
(function(){
'use strict';
const {h,svg,rnd,pick,shuffle,btn,chip,COLORS,CNAME,GAMES,art,ICON,SP}=window.LP;

/* ===== Tower of Hanoi ===== */
const DCOL=['#e0454b','#f5b92e','#44ad5f','#4c6fe0'];
GAMES.hanoi={title:'Tower of Hanoi',hat:'eng',tile:'t_hanoi',blurb:'Move the whole tower to the flag peg.',

 init(c){

  const SZ=['The smallest','The second smallest','The second biggest','The biggest'];
  const label=s=>s===1?'The smallest':s===n?'The biggest':n===3?'The middle one':s===2?'The second smallest':'The second biggest';
  function render(){
    c.area.replaceChildren();
    if(predicted==null&&!firstMoved)c.area.append(h('p',{class:'ask'},'Guess first: which disc will move first?'),
      h('div',{class:'chips'},Array.from({length:n},(_,i)=>i+1).map(s=>chip(label(s),()=>{predicted=s;c.fx('predict','Let us see!');render();}))));

      onclick:()=>tap(pi),onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(pi);}}},
      pi===2?h('span',{class:'goal','aria-hidden':'true'},art('flag',44)):null,p.map((s,k)=>h('div',{class:'disc'+(sel===pi&&k===p.length-1?' lift':''),style:'width:'+(28+s*(66/n))+'%;background:'+DCOL[s-1]}))))),
      h('div',{class:'row'},btn('Start again','ghost',()=>{if(moves)c.fx('persist');predicted=null;reset();},'replay')));
  }
  function tap(pi){
    if(done)return;
    if(sel==null){if(!pegs[pi].length)return;sel=pi;render();return;}
    if(sel===pi){sel=null;render();return;}
    const from=pegs[sel],to=pegs[pi],d=from[from.length-1];
    if(to.length&&to[to.length-1]<d){c.fx('retry','A bigger disc cannot sit on a smaller one. Try another peg.');const el=c.area.querySelectorAll('.peg')[pi];el&&el.classList.add('shake');sel=null;render();return;}
    from.pop();to.push(d);moves++;sel=null;
    const win=pegs[2].length===n;
    if(win){c.count('try');done=true;render();
      c.say('The whole tower moved!','wow','Can you teach someone how you did it?');
      c.area.append(h('p',{class:'ask'},'How did you do it? Tap one.'),h('div',{class:'chips'},['I moved the small one first','I moved the big one when the way was clear','I went step by step'].map(t=>chip(t,()=>c.reason(t)))),btn('Tell Spark how it went','go',()=>c.finish(),'tick'));return;}
    if(!firstMoved){firstMoved=true;c.fx('try',predicted==null?'':(predicted===d?'You guessed the disc that moved first!':'The disc that moved was size '+d+'. Does that surprise you?'));}
    else c.fx('try');
    render();}
  c.setAsk(()=>done?[]:[{q:'How do I move just one disc?',a:'Lift it and put it on an empty peg, or on a bigger disc.'},
    {q:'What if I only had two discs?',a:'Small disc to the spare peg. Big disc to the goal peg. Then small disc on top of it.'},

/* ===== River Crossing ===== */
const CAST=[[{pic:'wolf',n:'wolf'},{pic:'goat',n:'goat'},{pic:'cabbage',n:'cabbage'}],[{pic:'fox',n:'fox'},{pic:'hen',n:'hen'},{pic:'corn',n:'corn'}],[{pic:'tiger',n:'tiger'},{pic:'deer',n:'deer'},{pic:'grass',n:'grass'}]];
GAMES.river={title:'River Crossing',hat:'eng',tile:'t_river',blurb:'Row everyone across. Nobody gets eaten.',
 levels:['Wolf and goat','Fox and hen','Tiger and deer'],
 grown:{skill:'Planning with rules; seeing that going backwards can help. Levels two and three are the same puzzle with new friends, so ask whether the old plan still works.',ask:'Who is the tricky one? What did you try that did not work, and what did it tell you?',praise:'"You went back and tried a new plan." "You noticed the goat is tricky."'},
 init(c){
  const [A,B,C]=CAST[c.level-1];const names=[A,B,C];
  let st={L:new Set([0,1,2]),R:new Set(),boat:'L',load:null};let hist=[],msg=null,predicted=null,crossings=0,blocked=false,won=false;
  function trouble(side){const g=st[side];if(g.has(0)&&g.has(1))return 'the '+A.n+' would eat the '+B.n;if(g.has(1)&&g.has(2))return 'the '+B.n+' would eat the '+C.n;return null;}

    const bank=(side)=>h('div',{class:'bank'},[...st[side]].sort().map(i=>h('button',{class:'who-btn'+(st.load===i?' on':''),type:'button','aria-label':names[i].n+(st.load===i?', in the boat':''),disabled:won||blocked||st.boat!==side,onclick:()=>{st.load=st.load===i?null:i;render();}},art(names[i].pic,56))));

        art('farmer',52),st.load!=null?art(names[st.load].pic,52):h('span',{class:'seat'}),art('boat',72))),
      bank('R')),
      won?null:h('div',{class:'row'},(()=>{const r=btn('Row across','go',row,'play');if(blocked)r.disabled=true;return r;})(),btn('Go back one move','ghost',undo,'undo')),
      msg?h('p',{class:'note'},msg):null,
      !won&&st.load==null&&!blocked?h('p',{class:'note'},'Tap one to take along, or row across alone.'):null);
  }
  function row(){if(won||blocked)return;
    hist.push({L:new Set(st.L),R:new Set(st.R),boat:st.boat});
    const from=st.boat,to=from==='L'?'R':'L';
    if(st.load!=null){st[from].delete(st.load);st[to].add(st.load);}

    const t=trouble(from);
    if(t){msg='Oh dear! '+t.charAt(0).toUpperCase()+t.slice(1)+' while the farmer is away. Tap Go back one move and try another plan.';blocked=true;c.fx('retry',msg);render();return;}
    msg=null;
    if(st.R.size===3){won=true;c.count('try');render();c.say('Everyone crossed safely!','wow','How did you solve it? Tap one.');
      c.area.append(h('div',{class:'chips'},['I took the '+B.n+' first','I brought one back','I tried and went back'].map(t=>chip(t,()=>c.reason(t)))),btn('Tell Spark how it went','go',()=>c.finish(),'tick'));return;}
    if(crossings===1&&predicted!=null)c.fx('try',moved===predicted?'You guessed who goes first!':'You took '+(moved==null?'nobody':'the '+names[moved].n)+' first. Let us see what happens.');
    else c.fx('try');
    render();}
  function undo(){if(won||!hist.length)return;const p=hist.pop();st={L:p.L,R:p.R,boat:p.boat,load:null};msg=null;blocked=false;c.fx('change');render();}
  c.setAsk(()=>won?[]:[{q:'Who can stay together without the farmer?',a:'The '+A.n+' and the '+C.n+' can. The '+A.n+' does not eat the '+C.n+'.'},

    {q:'Can the farmer bring someone back?',a:'Yes! Bringing someone back can be a clever move.'}]);

/* ===== Robot Walks ===== */
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const LV={1:{w:3,h:3,start:[0,2,0],tr:[2,0],rocks:[],pre:null},
 2:{w:4,h:4,start:[0,3,0],tr:[3,0],rocks:[[1,2],[2,1]],pre:null},
 3:{w:4,h:4,start:[0,3,0],tr:[3,0],rocks:[[1,2],[2,1]],pre:['F','F','F','R','F','F','L']}};
function solve(L){const k=s=>s.join();const q=[[L.start,[]]],seen=new Set([k(L.start)]);
  while(q.length){const [s,p]=q.shift();if(s[0]===L.tr[0]&&s[1]===L.tr[1])return p;
    for(const a of ['F','L','R']){const n=step(L,s,a);if(!n)continue;if(seen.has(k(n)))continue;seen.add(k(n));q.push([n,p.concat(a)]);}}return [];}
function step(L,s,a){let [x,y,d]=s;if(a==='L')return [x,y,(d+3)%4];if(a==='R')return [x,y,(d+1)%4];
  const nx=x+DIRS[d][0],ny=y+DIRS[d][1];if(nx<0||ny<0||nx>=L.w||ny>=L.h||L.rocks.some(r=>r[0]===nx&&r[1]===ny))return null;return [nx,ny,d];}
const CARDN={F:'Forward',L:'Turn left',R:'Turn right'};
const CARDI={F:()=>ICON.up(),L:()=>ICON.turnl(),R:()=>ICON.turnr()};
GAMES.robot={title:'Robot Walks',hat:'eng',tile:'t_robot',blurb:'Give the robot cards to reach the treasure.',
 levels:['Small grid','Rocks','Find the bug'],
 grown:{skill:'Putting steps in order; finding and fixing a mistake (debugging).',ask:'Which card made the robot bump? What will you change?',praise:'"You found the card that was wrong." "You tested it, then changed it."'},
 init(c){
  const L=LV[c.level];let prog=L.pre?L.pre.slice():[];let sel=null,bad=null,run=null,rob=L.start.slice();let timer=null,won=false;
  const best=solve(L);
  c.onCleanup(()=>clearInterval(timer));
  const FACE=['up','right','down','left'];
  function render(){
    c.area.replaceChildren();
    const cells=[];
    for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){
      const rock=L.rocks.some(r=>r[0]===x&&r[1]===y),tr=L.tr[0]===x&&L.tr[1]===y,here=rob[0]===x&&rob[1]===y;
      cells.push(h('div',{class:'cell'+(rock?' rock':'')+(here?' here':''),'aria-label':here?'Robot, facing '+FACE[rob[2]]:tr?'Treasure':rock?'Rock':'Empty square'},
        here?h('span',{class:'robo',style:'transform:rotate('+rob[2]*90+'deg)'},art('robot',54)):tr?art('gem',50):rock?art('rock',50):''));}
    c.area.append(h('div',{class:'grid',style:'grid-template-columns:repeat('+L.w+',auto)'},cells),
      h('p',{class:'note'},'The robot is facing '+FACE[rob[2]]+'. Its cards:'),
      h('div',{class:'prog','aria-label':'Robot cards'},prog.length?prog.map((a,i)=>h('button',{class:'pc'+(sel===i?' sel':'')+(bad===i?' bad':''),type:'button','aria-label':CARDN[a]+(bad===i?', the robot bumped here':''),disabled:!!run||won,onclick:()=>{sel=sel===i?null:i;render();}},CARDI[a](),bad===i?h('span',{class:'bump'},art('x',20)):null)):h('span',{class:'note'},'No cards yet. Pick one below.')),
      h('div',{class:'chips'},['F','L','R'].map(a=>chip(CARDN[a],()=>add(a),{pic:CARDI[a](),disabled:!!run||won}))),
      h('div',{class:'row'},btn('Run!','go',go,'play'),
        btn('Take a card away','ghost',()=>{if(run||won||!prog.length)return;if(sel!=null){prog.splice(sel,1);sel=null;}else prog.pop();bad=null;rob=L.start.slice();c.fx('change');render();},'undo'),
        btn('Clear all','ghost',()=>{if(run||won||!prog.length)return;prog=[];sel=null;bad=null;rob=L.start.slice();render();},'cross')));
  }
  function add(a){if(run||won)return;if(sel!=null){prog[sel]=a;sel=null;c.fx('change');}else{if(prog.length>=10){c.say('That is the most cards the robot can hold.','smile');return;}prog.push(a);}bad=null;rob=L.start.slice();render();}
  function go(){
    if(run||won)return;if(!prog.length){c.say('Pick some cards first. Then press Run.','smile');return;}rob=L.start.slice();bad=null;let i=0;run=true;render();c.fx('try');
    timer=setInterval(()=>{
      if(i>=prog.length){clearInterval(timer);run=null;
        if(rob[0]===L.tr[0]&&rob[1]===L.tr[1]){won=true;render();c.say('The robot found the treasure!','wow','Which card was the hardest to choose?');
          c.area.append(h('div',{class:'chips'},['The turns','The forward cards','Counting squares'].map(t=>chip(t,()=>c.reason(t)))),btn('Tell Spark how it went','go',()=>c.finish(),'tick'));return;}
        c.fx('retry','The robot stopped on a different square. Tap a card to change it.');render();return;}
      const nx=step(L,rob,prog[i]);
      if(!nx){clearInterval(timer);run=null;bad=i;c.fx('retry','Bump! The robot hit something on card '+(i+1)+'. Which card could change?');render();return;}
      rob=nx;i++;render();},450);}
  c.setAsk(()=>won?[]:[{q:'Which way does the robot face?',a:'It starts facing '+FACE[L.start[2]]+' on the screen.'},
    {q:'How many squares to the treasure?',a:'Count along: '+(Math.abs(L.tr[0]-L.start[0]))+' across and '+(Math.abs(L.tr[1]-L.start[1]))+' up.'},
    {q:'What should the first card be?',a:best.length?'Try the "'+CARDN[best[0]]+'" card first.':'Try anything and see.'}]);
  c.intro(L.pre?'This program has a bug! Run it, then find the card to change.':'Pick cards to guide the robot to the treasure. Then press Run.','smile');
  render();}};

/* ===== Right-and-Up Paths ===== */
GAMES.paths={title:'Right-and-Up Paths',hat:'eng',tile:'t_paths',blurb:'Find every way to get to the flag.',
 levels:['2 by 2','2 by 3','3 by 3'],
 grown:{skill:'Finding all the possibilities with a system; knowing when you are finished.',ask:'How do you know we have them all? Is there a system?',praise:'"You used a system." "You checked for ones you missed."'},
 init(c){
  const W=[2,3,3][c.level-1],H=[2,2,3][c.level-1];
  const comb=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r);};
  const total=comb(W+H,H);let path=[[0,0]],found=[],keys=new Set(),predicted=null,msg='',over=false;
  const all=[];(function gen(s,x,y){if(x===W&&y===H){all.push(s);return;}if(x<W)gen(s+'R',x+1,y);if(y<H)gen(s+'U',x,y+1);})('',0,0);
  const CS=88,P=34;const X=x=>P+x*CS,Y=y=>P+(H-y)*CS;
  const toPts=k=>{let x=0,y=0;const p=[[0,0]];for(const ch of k){if(ch==='R')x++;else y++;p.push([x,y]);}return p;};
  function thumb(k){const s=svg('svg',{viewBox:'0 0 '+(W*20+10)+' '+(H*20+10),width:W*20+10,height:H*20+10,'aria-hidden':'true',focusable:'false'});
    s.append(svg('polyline',{points:toPts(k).map(p=>(5+p[0]*20)+','+(5+(H-p[1])*20)).join(' '),fill:'none',stroke:'#d0106f','stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round'}));return h('span',{class:'pop thumb'},s);}
  function render(flash){
    const sv=svg('svg',{viewBox:'0 0 '+(P*2+W*CS)+' '+(P*2+H*CS),style:'max-width:100%;width:'+(P*2+W*CS)+'px;height:auto;touch-action:manipulation','role':'group','aria-label':'Grid of dots'});
    if(flash)sv.append(svg('polyline',{points:toPts(flash).map(p=>X(p[0])+','+Y(p[1])).join(' '),fill:'none',stroke:'#f5b92e','stroke-width':16,'stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':'2 22'}));
    sv.append(svg('polyline',{points:path.map(p=>X(p[0])+','+Y(p[1])).join(' '),fill:'none',stroke:'#d0106f','stroke-width':9,'stroke-linecap':'round','stroke-linejoin':'round'}));
    for(let x=0;x<=W;x++)for(let y=0;y<=H;y++){
      const cur=path[path.length-1],isCur=cur[0]===x&&cur[1]===y,goal=x===W&&y===H;
      const g=svg('g',{style:'cursor:pointer',tabindex:'0',role:'button','aria-label':(goal?'Flag dot, ':'')+(x===0&&y===0?'Start dot, ':'')+'across '+x+', up '+y});
      const ci=svg('circle',{cx:X(x),cy:Y(y),r:goal?30:27});ci.style.fill=isCur?'#f5b92e':goal?'#ebebe8':'#fff';ci.style.stroke='#000';ci.setAttribute('stroke-width','4');g.append(ci);
      if(goal){const f=svg('g',{transform:'translate('+(X(x)-17)+' '+(Y(y)-19)+') scale(.55)'});f.innerHTML=SP.flag();g.append(f);}
      g.addEventListener('click',()=>tap(x,y));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(x,y);}});
      sv.append(g);}
    c.area.replaceChildren();
    if(predicted==null)c.area.append(h('p',{class:'ask'},'Guess first: how many different paths are there?'),h('div',{class:'chips'},[...new Set([3,total-3,total,total+4].filter(n=>n>1))].sort((a,b)=>a-b).map(n=>chip(String(n),()=>{predicted=n;c.fx('predict','Nobody has told you. Let us find out!');render();},{hear:false}))));
    c.area.append(h('p',{class:'ask'},'Start at the bottom left. Tap dots to go right or up until you reach the flag.'),h('div',{class:'center'},sv),
      over?null:h('div',{class:'row'},btn('Start this path again','ghost',()=>{path=[[0,0]];render();},'replay'),btn('I think we found them all','go',all_,'tick')),
      msg?h('p',{class:'note'},msg):null,
      h('p',{class:'note'},'Paths found so far: '+found.length),h('div',{class:'row'},found.map(thumb)));
  }
  function tap(x,y){if(over)return;const cur=path[path.length-1];
    if(path.length>1){const pr=path[path.length-2];if(pr[0]===x&&pr[1]===y){path.pop();render();return;}}
    const ok=(x===cur[0]+1&&y===cur[1])||(x===cur[0]&&y===cur[1]+1);
    if(!ok){c.fx('retry','Only right or up, one step at a time. Try a dot next to the one you are on.');msg='';render();return;}
    path.push([x,y]);
    if(x===W&&y===H){const k=path.slice(1).map((p,i)=>p[0]>path[i][0]?'R':'U').join('');
      if(keys.has(k)){c.say('You found that one already. Look for a different way.','think');}
      else{keys.add(k);found.push(k);c.fx('try','A new path! That is '+found.length+'.');}
      path=[[0,0]];}
    render();}
  function all_(){
    if(found.length<total){c.say('Hmm, let us check. Try this: always go right first, then change the last move.','think');render();return;}
    over=true;c.setAsk(null);c.fx('solved','You found them all! How did you know you had them all?');render();
    c.area.append(h('div',{class:'chips'},['I used a plan','I checked each start','I kept trying until no new ones'].map(t=>chip(t,()=>c.reason(t)))),btn('Tell Spark how it went','go',()=>c.finish(),'tick'));}
  c.setAsk(()=>over?[]:[{q:'How many paths are there?',a:'There are '+total+' paths. Can you find them all?'},
    {q:'Is there a trick to find them all?',a:'Try this. Always go right first, then change the last move. Then change the move before.'},
    {q:'Show me one I have not found.',a:found.length<total?'Look at the thick dotted path.':'You have found every one already!',run:()=>{const m=all.find(k=>!keys.has(k));if(m)render(m);}}]);
  c.intro('Find every different way to the flag. You can only go right or up.','smile');render();}};
})();
</script>
<script>
(function(){
'use strict';
const {h,svg,rnd,pick,shuffle,btn,chip,shapeSVG,GAMES,art,ICON}=window.LP;

/* ===== True, False or Check It ===== */
const CLAIMS=[
 {t:'Fish live in trees.',a:'F',pic:['fish','tree']},{t:'Ice is cold.',a:'T',pic:['ice']},{t:'Dogs can fly.',a:'F',pic:['dog','fly']},{t:'A triangle has three corners.',a:'T',pic:[{shape:'triangle'}]},
 {t:'The sun comes out at night.',a:'F',pic:['sun','moon']},{t:'Bees make honey.',a:'T',pic:['bee','honey']},
 {t:'Everybody in the world likes pizza.',a:'C',pic:['pizza'],how:['Ask lots of people','Look at the sky','Close my eyes'],right:0,l:2},
 {t:'It will rain tomorrow.',a:'C',pic:['rain'],how:['Wait and see tomorrow','Ask a toy','Count my fingers'],right:0,l:2},
 {t:'My teddy is the softest toy in the whole world.',a:'C',pic:['teddy'],how:['Feel lots of toys','Ask my shoe','Look at the moon'],right:0,l:2},
 {t:'There are 7 stars here.',a:'F',vis:{p:'star',n:5}},{t:'There are 4 apples here.',a:'T',vis:{p:'apple',n:4}},

GAMES.check={title:'True, False or Check It',hat:'sci',tile:'t_check',blurb:'Is it true, false, or do we need to check?',
 levels:['True or false','Or check it'],
 grown:{skill:'Telling what we know from what we only think; saying how we know.',ask:'How do you know? Did you see it, try it, or get told?',praise:'"You said you wanted to check." "You told me how you know."'},
 init(c){

      h('p',{class:'note'},'Tap each one to count. Counted: '+counted.size));}

      c.area.append(h('div',{class:'opts'},btn('True','go',()=>pickA('T'),'tick'),btn('False','go',()=>pickA('F'),'cross'),c.level===2?btn('Check it','ghost',()=>pickA('C'),'ask'):null));}
    else if(stage==='how'){c.area.append(h('p',{class:'ask'},'How do you know?'),h('div',{class:'chips'},['I saw it','I tried it','Someone told me','I worked it out'].map(t=>chip(t,()=>{c.reason(i+':'+t,'Good. We can know things in different ways.');stage='next';render();}))));}
    else if(stage==='check'){c.area.append(h('p',{class:'ask'},'How could we check?'),h('div',{class:'chips'},shuffle(q.how.map((t,k)=>[t,k])).map(([t,k])=>chip(t,()=>{
      if(k===q.right){c.fx('try','Yes! That would help us find out.');stage='next';render();}
      else c.fx('retry','Would that tell us? Think again.');}))));}
    if(stage==='next')c.area.append(btn(i<pool.length-1?'Next one':'Finish','go',()=>{if(i<pool.length-1){i++;stage='pick';counted=new Set();render();c.say(pool[i].t,'smile',c.level===2?'True, false, or check it?':'True or false?');}else c.finish();},'play'));
  }
  function pickA(a){const q=pool[i];
    if(q.vis&&a==='C'){c.fx('try','Good idea! Tap each one to count, then say true or false.');return;}
    if(a===q.a){if(q.a==='C'){c.fx('predict','Yes, we cannot be sure yet.');stage='check';}else{c.fx('try','Yes.');stage='how';}render();}
    else if(q.a==='C'){c.fx('retry','Hmm, can we be sure? How could we find out?');}
    else c.fx('retry',q.vis?'Count again. Tap each one.':'Think again. Have you seen it? Tried it? Could we check?');}
  c.setAsk(()=>[{q:'How can I tell?',a:'Ask yourself: have I seen it, tried it, or been told?'},
    {q:'What does "check it" mean?',a:'It means we are not sure yet. We find out first, then decide.'}]);
  c.intro('Is it true or false'+(c.level===2?', or do we need to check?':'?'),'smile');
  render();c.later(()=>c.say(pool[0].t,'think'),2600);}};

/* ===== Sink or Float ===== */
const THINGS=[{p:'stone',n:'stone',f:0},{p:'wood',n:'wood',f:1},{p:'apple',n:'apple',f:1},{p:'key',n:'key',f:0},{p:'leaf',n:'leaf',f:1},{p:'coin',n:'coin',f:0},{p:'duck',n:'rubber duck',f:1},{p:'ice',n:'ice cube',f:1},{p:'orange',n:'orange',f:1}];
const CLAY=[{p:'clayball',n:'clay ball',f:0},{p:'clayboat',n:'clay boat',f:1}];
GAMES.float={title:'Sink or Float',hat:'sci',tile:'t_float',blurb:'Guess, test and compare.',
 levels:['Things','Change one thing'],
 grown:{skill:'Predicting, testing fairly and comparing; explaining a surprise.',ask:'Were you surprised? Why do you think it floated? What if we changed one thing?',praise:'"You guessed first." "You tested another one to find out."'},
 init(c){
  const items=c.level===2?CLAY.concat(THINGS.slice(0,4)):THINGS;let cur=null,pred=null,res=null,log=[];
  function render(){
    c.area.replaceChildren(h('div',{class:'shelf'},items.map((it,k)=>h('button',{class:'card'+(cur===k?' sel':''),type:'button','aria-label':it.n,'aria-pressed':String(cur===k),onclick:()=>{cur=k;pred=null;res=null;c.say('Will the '+it.n+' sink or float?','think');render();}},art(it.p,50),h('small',null,it.n)))));
