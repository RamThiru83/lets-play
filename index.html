<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Let's Play!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one calm column. Home = three hat sections + big games. Game = Spark's bubble on top, play area, tray below. */
:root{
  --bg:#EEF2FB; --surface:#FFFFFF; --ink:#1D2142; --muted:#555B8C; --line:#D0D8EF; --soft:#E4EAF9;
  --det:#5B4BDB; --eng:#C25800; --sci:#08796C; --big:#A02F86; --spark:#FFC93C;
  --on-det:#FFFFFF; --on-eng:#FFFFFF; --on-sci:#FFFFFF; --on-big:#FFFFFF;
  --ok:#1B7F4B; --info:#2F5BD6; --shadow:0 2px 0 rgba(29,33,66,.14),0 10px 24px rgba(29,33,66,.08);
  --f-display:'Baloo 2',ui-rounded,'Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',ui-rounded,system-ui,sans-serif;
  --hat:var(--det); --on-hat:var(--on-det);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12152B; --surface:#1D2144; --ink:#EEF0FF; --muted:#A9AFDC; --line:#4A528C; --soft:#262B57;
  --det:#9A8FFF; --eng:#FF9A47; --sci:#35D1BE; --big:#F08AD6; --spark:#FFD25E;
  --on-det:#12152B; --on-eng:#12152B; --on-sci:#12152B; --on-big:#12152B;
  --ok:#52D68F; --info:#8FA8FF; --shadow:0 2px 0 rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12152B; --surface:#1D2144; --ink:#EEF0FF; --muted:#A9AFDC; --line:#4A528C; --soft:#262B57;
  --det:#9A8FFF; --eng:#FF9A47; --sci:#35D1BE; --big:#F08AD6; --spark:#FFD25E;
  --on-det:#12152B; --on-eng:#12152B; --on-sci:#12152B; --on-big:#12152B;
  --ok:#52D68F; --info:#8FA8FF; --shadow:0 2px 0 rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:700 18px/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;
  -webkit-tap-highlight-color:transparent}
[data-hat="det"]{--hat:var(--det);--on-hat:var(--on-det)}
[data-hat="eng"]{--hat:var(--eng);--on-hat:var(--on-eng)}
[data-hat="sci"]{--hat:var(--sci);--on-hat:var(--on-sci)}
[data-hat="big"]{--hat:var(--big);--on-hat:var(--on-big)}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:4px solid var(--info);outline-offset:3px;border-radius:12px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:64px;height:70px;flex:none}
.brand h1{font-size:2.3rem;font-weight:800}
.tag{color:var(--muted);font-size:1rem}
.lead{font-size:1.1rem;max-width:60ch}
.iconbtn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:8px 16px;border:2px solid var(--line);background:var(--surface);border-radius:999px;font-weight:800}
.iconbtn[aria-pressed="true"]{border-color:var(--ink)}
.iconbtn svg{width:22px;height:22px;flex:none}
.hatsec{display:flex;flex-direction:column;gap:10px}
.hathead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hathead h2{font-size:1.5rem;color:var(--hat)}
.hathead p{color:var(--muted);font-size:1rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:12px;text-align:left;min-height:84px;padding:12px 14px;background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--hat)}
.badge{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.8rem;background:color-mix(in srgb,var(--hat) 16%,var(--surface))}
.tile b{display:block;font-family:var(--f-display);font-size:1.15rem;line-height:1.15}
.tile span.sub{display:block;color:var(--muted);font-size:.9rem;font-weight:700;line-height:1.25}
.foot{display:flex;gap:10px;flex-wrap:wrap}
/* game screen */
.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gbar h2{font-size:1.5rem;color:var(--hat);flex:1;min-width:0}
.spark{display:flex;align-items:flex-end;gap:10px}
.spark svg{width:74px;height:82px;flex:none}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:22px 22px 22px 6px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow);min-height:64px}
.bubble-text{flex:1;min-width:0;font-size:1.1rem}
.bubble-text .extra{display:block;margin-top:4px;color:var(--muted);font-weight:700;font-size:1rem}
.say{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--soft);display:grid;place-items:center;padding:0}
.say svg{width:22px;height:22px}
.area{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px;align-items:stretch;min-height:240px}
.tray{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:52px;padding:10px 20px;border-radius:16px;border:2px solid var(--hat);background:var(--hat);color:var(--on-hat);font-weight:800;font-family:var(--f-display);font-size:1.1rem;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.ask{background:var(--spark);color:#1D2142;border-color:var(--spark)}
.btn[disabled],.chip[disabled]{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:52px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--hat)}
.chip.on{background:var(--hat);color:var(--on-hat);border-color:var(--hat)}
.chip.no{text-decoration:line-through;opacity:.5}
.levels{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.95rem}
.levels .chip{min-height:42px;font-size:.95rem;padding:4px 14px}
.note{font-size:1rem;color:var(--muted)}
.note b{color:var(--ink)}
.center{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sheet{position:fixed;inset:0;background:rgba(10,12,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.sheet>div{background:var(--surface);border-radius:24px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:10px;max-height:85%;overflow:auto}
.sheet .chip{justify-content:flex-start;text-align:left;border-radius:18px}
details.grown{background:var(--soft);border-radius:18px;padding:12px 16px}
details.grown summary{cursor:pointer;font-family:var(--f-display);font-size:1.1rem}
details.grown p{margin-top:8px;font-weight:600;font-size:1rem}
/* pieces */
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.hoops{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hoop{min-height:150px;border:4px dashed var(--hat);border-radius:50% / 40%;display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;align-content:center;padding:16px;background:transparent}
.hoop:hover{background:color-mix(in srgb,var(--hat) 10%,transparent)}
.big-item{display:grid;place-items:center;min-height:90px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:96px;padding:6px;border:2px solid var(--line);background:var(--surface);border-radius:18px;transition:opacity .2s,transform .2s}
.card .em{font-size:2.4rem;line-height:1}
.card small{font-weight:800;font-size:.85rem;color:var(--muted)}
.card.down{opacity:.22;transform:scale(.92)}
.card.sel{border-color:var(--hat);box-shadow:0 0 0 4px color-mix(in srgb,var(--hat) 30%,transparent)}
.card.mine{border-style:dashed;border-color:var(--hat)}
.train{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.bead{width:46px;height:46px;border-radius:50%;border:3px solid rgba(0,0,0,.22);display:grid;place-items:center;font-weight:800;color:var(--muted);padding:0;background:var(--soft)}
.bead.empty{border-style:dashed;border-color:var(--hat);background:transparent}
.bead.sel{outline:4px solid var(--hat);outline-offset:2px}
.palette{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.palette .bead{width:60px;height:60px}
.dots{display:inline-flex;gap:4px}
.dots i{width:18px;height:18px;border-radius:50%;display:block;border:2px solid rgba(0,0,0,.2)}
.who{position:relative;padding:4px;border:3px solid var(--line);border-radius:18px;background:var(--surface);display:flex;flex-direction:column;align-items:center;min-height:100px}
.who.out{opacity:.25}
.who.out::after{content:"";position:absolute;inset:6px;background:linear-gradient(to top right,transparent 47%,#D6333B 47%,#D6333B 53%,transparent 53%)}
.clues{display:flex;flex-direction:column;gap:6px}
.clue{background:var(--soft);padding:8px 12px;border-radius:14px;font-weight:700}
.clue.new{outline:3px solid var(--hat)}
.numline{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.num{min-width:48px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-family:var(--f-display);font-size:1.1rem}
.num.out{opacity:.25}.num[disabled]{opacity:.45}.peg .goal{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:1.6rem;z-index:2;color:var(--spark)}.arrowtag{position:absolute;right:4px;bottom:0;font-size:1.1rem;font-weight:800;color:var(--hat)}.bounce{animation:pop .35s}
.num.pick{border-color:var(--hat);background:color-mix(in srgb,var(--hat) 18%,var(--surface))}
.pegs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.peg{position:relative;min-height:230px;border-radius:18px;background:var(--soft);border:3px solid transparent;display:flex;flex-direction:column-reverse;align-items:center;gap:4px;padding:8px 4px 10px;cursor:pointer}
.peg::before{content:"";position:absolute;left:50%;top:10px;bottom:0;width:10px;margin-left:-5px;background:var(--line);border-radius:6px}
.peg.sel{border-color:var(--hat)}
.disc{position:relative;height:30px;border-radius:15px;border:3px solid rgba(0,0,0,.25);z-index:1}
.disc.lift{transform:translateY(-10px);box-shadow:0 8px 0 rgba(0,0,0,.15)}
.river{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px;align-items:stretch}
.bank{background:color-mix(in srgb,var(--ok) 20%,var(--surface));border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;min-height:230px}
.water{background:color-mix(in srgb,var(--info) 25%,var(--surface));border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;position:relative}
.who-btn{font-size:2.2rem;min-width:64px;min-height:64px;border-radius:18px;border:3px solid var(--line);background:var(--surface);padding:0;display:grid;place-items:center}
.who-btn.on{border-color:var(--hat);box-shadow:0 0 0 4px color-mix(in srgb,var(--hat) 30%,transparent)}
.who-btn[disabled]{opacity:.5}
.grid{display:grid;gap:4px;justify-content:center}
.cell{width:64px;height:64px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:2rem;position:relative}
.cell.rock{background:color-mix(in srgb,var(--muted) 30%,var(--surface))}
.cell.here{outline:4px solid var(--hat)}
.prog{display:flex;gap:6px;flex-wrap:wrap;min-height:58px;padding:8px;border:3px dashed var(--line);border-radius:16px}
.pc{min-width:50px;min-height:50px;border-radius:14px;border:2px solid var(--hat);background:color-mix(in srgb,var(--hat) 18%,var(--surface));font-size:1.5rem;font-weight:800;padding:0}
.pc.sel{background:var(--hat);color:var(--on-hat)}
.pc.bad{outline:4px solid #D6333B}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opts .btn{flex:1;min-width:110px}
.tank{position:relative;height:200px;border-radius:18px;background:linear-gradient(to bottom,var(--soft) 0 30%,color-mix(in srgb,var(--info) 35%,var(--surface)) 30% 100%);overflow:hidden}
.tank .thing{position:absolute;left:50%;top:6px;font-size:3rem;transform:translateX(-50%);transition:top 1.1s ease-in}
.tank.sink .thing{top:140px}
.tank.float .thing{top:44px;animation:bob 1.6s ease-in-out 1.1s infinite}
.shelf{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.shelf .chip{font-size:1.6rem;padding:4px 14px}
.puppets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pup{border:3px solid var(--line);border-radius:20px;padding:10px;text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pup .em{font-size:2.6rem;line-height:1}
.pup.right{border-color:var(--ok)}
.pup.wrong{border-color:var(--muted);opacity:.8}
.board{display:grid;grid-template-columns:repeat(3,84px);gap:6px;justify-content:center}
.sq{width:84px;height:84px;border-radius:16px;border:3px solid var(--line);background:var(--surface);font-size:2.8rem;font-family:var(--f-display);font-weight:800;padding:0}
.sq.flash{outline:5px solid var(--spark)}
.stones{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stone{width:44px;height:44px;border-radius:44% 56% 52% 48%;background:#8F96B8;border:3px solid rgba(0,0,0,.25)}
.good{color:var(--ok)}
.report{display:flex;flex-direction:column;gap:6px;font-size:1.15rem}
.report p::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--hat);margin-right:10px}
.hgrid{display:grid;gap:12px}
.entry{border:2px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--surface)}
.entry small{color:var(--muted);font-weight:700}
.prose{display:flex;flex-direction:column;gap:12px;font-weight:600;max-width:62ch}
.prose h2{font-size:1.35rem;margin-top:6px}
.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
@media (max-width:480px){.gbar h2{flex:1 1 100%;order:3}.brand h1{font-size:1.9rem}.cell{width:56px;height:56px}.board{grid-template-columns:repeat(3,76px)}.sq{width:76px;height:76px}.river{grid-template-columns:1fr 1fr 1fr}.who-btn{min-width:56px;min-height:56px;font-size:1.9rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="app"></div>
<script>
(function(){
'use strict';
const $=(s,e=document)=>e.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);}
  for(const kid of kids.flat(9)){if(kid==null||kid===false)continue;e.append(kid.nodeType?kid:document.createTextNode(String(kid)));}
  return e;}
function svg(tag,attrs,...kids){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]);kids.forEach(k=>k&&e.append(k));return e;}
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const store={get(k,d){try{const v=localStorage.getItem('lp_'+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('lp_'+k,JSON.stringify(v));}catch(e){}}};
const plural=(n,w,pl)=>(n>10?'lots of':n)+' '+(n===1?w:(pl||w+'s'));

/* ---------- pictures ---------- */
const COLORS={red:'#D6333B',blue:'#2F5BD6',yellow:'#F2B705',green:'#2E9E5B'};
const CNAME=['red','blue','yellow','green'];
function shapeSVG(shape,color,px){
  px=px||56;const s=svg('svg',{viewBox:'0 0 60 60',width:px,height:px,'aria-hidden':'true'});
  let el;
  if(shape==='circle')el=svg('circle',{cx:30,cy:30,r:24});
  else if(shape==='square')el=svg('rect',{x:7,y:7,width:46,height:46,rx:4});
  else if(shape==='triangle')el=svg('polygon',{points:'30,5 56,53 4,53'});
  else el=svg('polygon',{points:'30,4 37,22 56,23 41,35 46,54 30,43 14,54 19,35 4,23 23,22'});
  el.setAttribute('fill',COLORS[color]||color);el.setAttribute('stroke','rgba(0,0,0,.3)');el.setAttribute('stroke-width','2');
  s.append(el);return s;}
const ICON={
  speaker:()=>svg('svg',{viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':2.4,'stroke-linecap':'round','stroke-linejoin':'round'},
    svg('path',{d:'M4 9v6h4l5 4V5L8 9H4z'}),svg('path',{d:'M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12'})),
  mute:()=>svg('svg',{viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':2.4,'stroke-linecap':'round','stroke-linejoin':'round'},
    svg('path',{d:'M4 9v6h4l5 4V5L8 9H4z'}),svg('path',{d:'M17 9l5 6M22 9l-5 6'})),
  back:()=>svg('svg',{viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':3,'stroke-linecap':'round','stroke-linejoin':'round'},svg('path',{d:'M15 5l-7 7 7 7'})),
};
function sparkSVG(){
  const s=svg('svg',{viewBox:'0 0 100 110','aria-hidden':'true'});
  s.innerHTML='<line x1="50" y1="18" x2="50" y2="32" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>'+
   '<circle cx="50" cy="12" r="8" fill="var(--spark)" stroke="currentColor" stroke-width="3"/>'+
   '<ellipse cx="50" cy="68" rx="38" ry="34" fill="var(--spark)" stroke="currentColor" stroke-width="3"/>'+
   '<ellipse cx="37" cy="62" rx="8" ry="9" fill="#fff" stroke="#1D2142" stroke-width="2"/><ellipse cx="63" cy="62" rx="8" ry="9" fill="#fff" stroke="#1D2142" stroke-width="2"/>'+
   '<circle class="pl" cx="38" cy="64" r="4.2" fill="#1D2142"/><circle class="pr" cx="62" cy="64" r="4.2" fill="#1D2142"/>'+
   '<circle cx="27" cy="78" r="5" fill="#FF8A7A" opacity=".55"/><circle cx="73" cy="78" r="5" fill="#FF8A7A" opacity=".55"/>'+
   '<path class="mouth" d="M40 80 Q50 90 60 80" stroke="#1D2142" stroke-width="4" fill="none" stroke-linecap="round"/>'+
   '<ellipse cx="38" cy="104" rx="9" ry="5" fill="currentColor"/><ellipse cx="62" cy="104" rx="9" ry="5" fill="currentColor"/>';
  s.style.color='var(--ink)';return s;}
function setMood(s,m){const mo=$('.mouth',s),pl=$('.pl',s),pr=$('.pr',s);if(!mo)return;
  const D={smile:'M40 80 Q50 90 60 80',wow:'M44 80 Q50 94 56 80 Q50 76 44 80Z',hmm:'M42 84 Q50 80 58 84',think:'M42 84 Q50 82 58 84'}[m]||'M40 80 Q50 90 60 80';
  mo.setAttribute('d',D);mo.setAttribute('fill',m==='wow'?'#1D2142':'none');
  const up=m==='think'||m==='hmm';pl.setAttribute('cy',up?58:64);pr.setAttribute('cy',up?58:64);}

/* ---------- speech ---------- */
const App={voice:store.get('voice',true),cleanup:null,sess:null};
/* Recorded voice: Google Chirp 3 HD "Achernar" (same narrator as the Little Scientists Club films).
   Every sentence Spark can say is a clip in audio/voice.bin. A line with any unrecorded sentence
   falls back to the browser voice. Sentence rules match scripts/voice/text.mjs in the Munchkin project. */
const EMOJI=/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]|\uFE0F|\u200D/gu;
function sentences(text){const t=String(text).replace(EMOJI,'').replace(/\s+/g,' ').trim();if(!t)return [];
  return t.replace(/([.!?])\s+(?=\S)/g,'$1\n').split('\n').map(x=>x.trim()).filter(Boolean);}
const keyOf=s=>s.toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/\s+/g,' ').trim();
const clips=new Map();let packP=null,actx=null,curSrc=null,tok=0;
function loadPack(){if(packP)return packP;
  packP=fetch('audio/voice.bin').then(r=>r.ok?r.arrayBuffer():null).then(buf=>{if(!buf)return;
    const n=new DataView(buf).getUint32(0,true);const head=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,n)));
    for(const k in head.clips){const c=head.clips[k];clips.set(k,{buf,at:4+n+c[0],len:c[1]});}}).catch(()=>{});return packP;}
function browserSpeak(t){try{const s=window.speechSynthesis;if(!s)return;s.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;u.pitch=1.15;s.speak(u);}catch(e){}}
async function speak(t){if(!App.voice)return;const my=++tok;stopAudio();const ss=sentences(t);if(!ss.length)return;
  await loadPack();if(my!==tok)return;
  if(ss.every(x=>clips.has(keyOf(x)))){
    try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')await actx.resume();
      for(const x of ss){if(my!==tok)return;const c=clips.get(keyOf(x));const ab=c.buf.slice(c.at,c.at+c.len);
        const buf=await actx.decodeAudioData(ab);if(my!==tok)return;
        await new Promise(res=>{const src=actx.createBufferSource();src.buffer=buf;src.connect(actx.destination);curSrc=src;src.onended=res;src.start();});}
      return;}catch(e){}}
  if(my===tok)browserSpeak(t);}
function stopAudio(){try{if(curSrc){curSrc.onended=null;curSrc.stop();}}catch(e){}curSrc=null;try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}}
function stopSpeech(){tok++;stopAudio();}
const root=$('#app');
function view(node){if(App.cleanup){try{App.cleanup();}catch(e){}App.cleanup=null;}stopSpeech();root.replaceChildren(node);window.scrollTo(0,0);}
const btn=(label,cls,fn)=>h('button',{class:'btn '+(cls||''),type:'button',onclick:fn},label);
const chip=(label,fn,cls)=>h('button',{class:'chip '+(cls||''),type:'button',onclick:fn},label);
function voiceBtn(){
  const b=h('button',{class:'iconbtn',type:'button','aria-pressed':String(App.voice),onclick:()=>{
    App.voice=!App.voice;store.set('voice',App.voice);b.setAttribute('aria-pressed',String(App.voice));
    b.replaceChildren(App.voice?ICON.speaker():ICON.mute(),App.voice?'Voice on':'Voice off');if(!App.voice)stopSpeech();}},
    App.voice?ICON.speaker():ICON.mute(),App.voice?'Voice on':'Voice off');return b;}

/* ---------- effort feedback: praise what the child DID, never points ---------- */
const PRAISE={
 try:["You tried one! Now we know more.","You gave it a go! Look what happened.","A try! Trying is how we learn."],
 retry:["That did not work, and now you know something new. Try again!","A miss gives a clue. What will you change?","You kept going. That is strong thinking."],
 change:["You changed your plan. Clever thinkers do that!","A new way! I like how you switched."],
 question:["What a good question!","Asking is how detectives find things out.","Good asking! Let us see what it tells us."],
 predict:["You guessed first. That is a scientist move!","Guessing before testing helps us learn."],
 explain:["Thank you for telling me how you think.","You gave a reason. That is brilliant thinking."],
 create:["You made a puzzle for someone else!","You are a puzzle maker now."],
 persist:["You are still going. I love that.","Starting again with a new plan is smart."]};
const COUNT={try:'tries',retry:'retries',change:'changes',question:'questions',predict:'predictions',explain:'explains',create:'creates',persist:'changes'};
const GAMES={};
const HATS={det:{name:'Detective',sub:'Ask, look and work it out',ids:['rule','animal','odd','pattern','mango','number']},
 eng:{name:'Engineer',sub:'Make a plan and fix it',ids:['hanoi','river','robot','paths']},
 sci:{name:'Scientist',sub:'Guess, test and compare',ids:['check','float','whoknows']},
 big:{name:'Big Games',sub:'For a longer play with a grown-up',ids:['stones','ttt','']}};
HATS.big.ids=['stones','ttt'];

/* ---------- home ---------- */
function home(){
  App.sess=null;loadPack();
  const sec=k=>{const H=HATS[k];
    return h('section',{class:'hatsec','data-hat':k},
      h('div',{class:'hathead'},h('h2',null,H.name),h('p',null,H.sub)),
      h('div',{class:'tiles'},H.ids.map(id=>{const g=GAMES[id];
        return h('button',{class:'tile',type:'button',onclick:()=>openGame(id)},
          h('span',{class:'badge','aria-hidden':'true'},g.emoji),
          h('span',null,h('b',null,g.title),h('span',{class:'sub'},g.blurb)));})));};
  view(h('div',{class:'wrap'},
    h('header',{class:'top'},
      h('div',{class:'brand'},(()=>{const s=sparkSVG();return s;})(),
        h('div',null,h('h1',null,"Let's Play!"),h('p',{class:'tag'},'Games where trying counts.'))),
      voiceBtn()),
    h('p',{class:'lead'},'Pick a game. Ask questions. Try things out. Spark cheers for how you think, not for winning.'),
    ['det','eng','sci','big'].map(sec),
    h('nav',{class:'foot'},
      btn('My thinking journal','ghost',journal),btn('For grown-ups','ghost',grownups))));
}

/* ---------- game shell ---------- */
function openGame(id,level){
  const g=GAMES[id];level=level||store.get('lvl_'+id,1);if(level>g.levels.length)level=1;
  const sess={id,level,tries:0,retries:0,questions:0,changes:0,predictions:0,explains:0,creates:0};
  App.sess=sess;let n=0;const cleanups=[];let askFn=null,timers=[];
  const sp=sparkSVG();
  const bt=h('div',{class:'bubble-text'});
  const bubble=h('div',{class:'bubble','aria-live':'polite'},bt,
    h('button',{class:'say',type:'button','aria-label':'Read aloud',onclick:()=>speak(bt.textContent)},ICON.speaker()));
  const area=h('div',{class:'area'});
  { const ap=Element.prototype.append,rc=Element.prototype.replaceChildren; const ok=a=>a.filter(x=>x!=null&&x!==false); area.append=(...a)=>ap.apply(area,ok(a)); area.replaceChildren=(...a)=>rc.apply(area,ok(a)); }
  const tray=h('div',{class:'tray'});
  const askBtn=btn('Ask Spark','ask',openAsk);askBtn.hidden=true;
  const doneBtn=btn("I'm done",'ghost',()=>finish());
  tray.append(askBtn,doneBtn);
  const lv=h('div',{class:'levels'},'Pick your challenge:',g.levels.map((nm,i)=>
    chip(nm,()=>{store.set('lvl_'+id,i+1);openGame(id,i+1);},i+1===level?'on':'')));
  const gr=h('details',{class:'grown'},h('summary',null,'For the grown-up'),
    h('p',null,h('b',null,'Practises: '),g.grown.skill),h('p',null,h('b',null,'Ask: '),g.grown.ask),h('p',null,h('b',null,'Praise: '),g.grown.praise));
  const screen=h('div',{class:'wrap','data-hat':g.hat},
    h('div',{class:'gbar'},h('button',{class:'iconbtn',type:'button',onclick:home},ICON.back(),'Home'),h('h2',null,g.title),voiceBtn()),
    h('div',{class:'spark'},sp,bubble),area,tray,lv,gr);
  const ctx={area,level,sess,
    say(t,mood,extra){bt.replaceChildren(t);if(extra)bt.append(h('span',{class:'extra'},extra));
      setMood(sp,mood||'smile');speak(t+(extra?' '+extra:''));},
    mood(m){setMood(sp,m);},
    fx(kind,extra){sess[COUNT[kind]]++;
      if(kind==='retry')sess.tries++;
      let t;
      if(kind==='try'){n++;t=(n%2===1)?PRAISE.try[rnd(3)]:'';sp.classList.remove('bounce');void sp.getBoundingClientRect();sp.classList.add('bounce');setMood(sp,'wow');}
      else t=PRAISE[kind][sess[COUNT[kind]]%PRAISE[kind].length];
      if(t||extra){bt.replaceChildren(t||extra);if(t&&extra)bt.append(h('span',{class:'extra'},extra));
        setMood(sp,kind==='retry'?'hmm':kind==='question'?'think':'wow');speak((t||'')+' '+(extra||''));}
      return t;},
    setAsk(fn){askFn=fn;askBtn.hidden=!fn;},
    finish(){finish();},
    restart(lv2){openGame(id,lv2||level);},
    later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t;},
    onCleanup(fn){cleanups.push(fn);}};
  function openAsk(){
    const items=askFn?askFn():[];if(!items.length){ctx.say('You have asked everything for now. Try something and ask again!','smile');return;}
    const sheet=h('div',{class:'sheet',onclick:e=>{if(e.target===sheet)sheet.remove();}},
      h('div',{'data-hat':g.hat},h('h3',null,'What do you want to ask Spark?'),
        items.map(it=>chip(it.q,()=>{sheet.remove();ctx.fx('question');ctx.say(it.a,'think');if(it.run)it.run();})),
        btn('Close','ghost',()=>sheet.remove())));
    screen.append(sheet);}
  function finish(){endScreen(g,sess,ctx);}
  view(screen);
  App.cleanup=()=>{timers.forEach(clearTimeout);cleanups.forEach(f=>{try{f();}catch(e){}});};
  g.init(ctx);
}

/* ---------- end of a play: describe what the child did ---------- */
function endScreen(g,sess,ctx){
  const lines=[];
  if(sess.tries)lines.push('You tried '+plural(sess.tries,'thing')+'.');
  if(sess.retries)lines.push('Something surprised you '+plural(sess.retries,'time')+', and you carried on.');
  if(sess.questions)lines.push('You asked '+plural(sess.questions,'question')+'.');
  if(sess.changes)lines.push('You changed your plan '+plural(sess.changes,'time')+'.');
  if(sess.predictions)lines.push('You guessed first '+plural(sess.predictions,'time')+'.');
  if(sess.explains)lines.push('You gave '+plural(sess.explains,'reason')+'.');
  if(sess.creates)lines.push('You made '+plural(sess.creates,'puzzle')+' for someone else.');
  if(!lines.length)lines.push('You had a look around. Next time, try one thing and see what happens.');
  const entry={game:g.title,when:new Date().toISOString().slice(0,10),sess:Object.assign({},sess)};
  const J=store.get('journal',[]);J.unshift(entry);store.set('journal',J.slice(0,40));
  let told=false;
  const reply=h('p',{class:'note'},'');
  const mk=t=>chip(t,function(){this.classList.toggle('on');if(!told){told=true;entry.sess.explains++;
      J[0]=entry;store.set('journal',J.slice(0,40));reply.textContent='Thank you for telling me. Saying how you think makes you stronger.';speak(reply.textContent);}});
  const next=[btn('Play again','',()=>ctx.restart(sess.level))];
  if(sess.level<g.levels.length)next.push(btn('Try a bigger challenge','ghost',()=>{store.set('lvl_'+sess.id,sess.level+1);ctx.restart(sess.level+1);}));
  next.push(btn('Choose another game','ghost',home));
  const screen=h('div',{class:'wrap','data-hat':g.hat},
    h('div',{class:'gbar'},h('h2',null,'Here is what you did'),h('button',{class:'say',type:'button','aria-label':'Read aloud',onclick:()=>speak(lines.join(' '))},ICON.speaker()),voiceBtn()),
    h('div',{class:'area'},h('div',{class:'report'},lines.map(l=>h('p',null,l))),
      h('p',null,'What did you do? Tap any that fit.'),
      h('div',{class:'chips'},['I tried different ways','I asked a question','I changed my plan','It was tricky','It was easy'].map(mk)),reply),
    h('p',{class:'note'},h('b',null,'Talk about it: '),g.grown.ask),
    h('div',{class:'tray'},next));
  view(screen);speak('Here is what you did. '+lines.join(' '));
}

/* ---------- journal and grown-ups ---------- */
function journal(){
  const J=store.get('journal',[]);
  const q=J.reduce((a,e)=>a+(e.sess.questions||0),0);
  const bits=s=>[s.tries&&plural(s.tries,'try','tries'),s.questions&&plural(s.questions,'question'),s.changes&&('changed plan '+plural(s.changes,'time')),s.predictions&&plural(s.predictions,'guess','guesses')+' first'].filter(Boolean).join(' · ');
  view(h('div',{class:'wrap','data-hat':'det'},
    h('div',{class:'gbar'},h('button',{class:'iconbtn',type:'button',onclick:home},ICON.back(),'Home'),h('h2',null,'My thinking journal')),
    h('p',{class:'lead'},J.length?'Questions asked so far in this browser: '+q+'. These are just to talk about. There is nothing to beat.':'Nothing here yet. Play a game and come back.'),
    h('div',{class:'hgrid'},J.slice(0,15).map(e=>h('div',{class:'entry'},h('b',null,e.game),' ',h('small',null,e.when),h('div',{class:'note'},bits(e.sess)||'Had a look')))),
    J.length?btn('Clear journal','ghost',()=>{store.set('journal',[]);journal();}):null));
}
function grownups(){
  view(h('div',{class:'wrap','data-hat':'det'},
    h('div',{class:'gbar'},h('button',{class:'iconbtn',type:'button',onclick:home},ICON.back(),'Home'),h('h2',null,'For grown-ups')),
    h('div',{class:'prose'},
      h('p',null,"Let's Play! is built for ages 5 to 7. It practises three habits: working out rules (Detective), making and fixing plans (Engineer), and testing ideas (Scientist)."),
      h('h2',null,'How the games work'),
      h('ul',null,
        h('li',null,'No points, stars, streaks or timers. Studies of external rewards find they can lower children’s interest in an activity they already enjoy, so Spark gives none.'),
        h('li',null,'Spark names what the child did: a try, a changed plan, a question, a reason. Praise for process rather than outcome is linked with children later seeing ability as something that grows. The evidence is mostly observational.'),
        h('li',null,'Hints are questions. The child asks Spark, and Spark answers only what was asked. Asking is the skill being practised.'),
        h('li',null,'A miss is information. Games say what the miss tells us and let the child try again straight away.'),
        h('li',null,'The child picks the challenge level. Nothing is unlocked by winning.')),
      h('h2',null,'How to join in'),
      h('ul',null,
        h('li',null,'Sit beside the child. Ask "What did you try?" and "What will you change?" more than "Is it right?".'),
        h('li',null,'Praise the specific thing: "You changed your plan when that did not work."'),
        h('li',null,'Wait. Let the child talk before you help. Each game has a "For the grown-up" box with a question to ask.'),
        h('li',null,'Pair screen play with real objects: sorting hoops, beads, stones, a floor robot. Skills practised on a screen do not automatically carry over, so talk about where else the idea shows up.')),
      h('h2',null,'The journal'),
      h('p',null,'The journal counts tries and questions only so you can talk about them. Please do not set targets. It stays in this browser and nothing is sent anywhere.'))));

/* shared exports for the game files */
Object.assign(window.LP={},{h,svg,rnd,pick,shuffle,btn,chip,shapeSVG,COLORS,CNAME,GAMES,plural,home,openGame,speak,sparkSVG});
window.addEventListener('DOMContentLoaded',()=>{});
window.LP.boot=()=>home();
})();

<script>
(function(){
'use strict';
const {h,svg,rnd,pick,shuffle,btn,chip,shapeSVG,COLORS,CNAME,GAMES}=window.LP;

/* ===== Secret Rule Sort ===== */
GAMES.rule={title:'Secret Rule Sort',hat:'det',emoji:'🧺',blurb:'Guess where it goes. Find the secret rule.',
 levels:['One thing','Not','Two things'],
 grown:{skill:'Finding a hidden rule from examples; testing a guess against evidence.',ask:'What made you think it would go there? What is the same about the things in this hoop?',praise:'"You guessed first, even though you were not sure." "You asked about shape to narrow it down."'},
 init(c){
  const F={colour:CNAME,shape:['circle','square','triangle','star']},SZ=['small','big'];
  const nm=(f,v)=>f==='shape'?v+'s':v+' things';
  const all=[];
  if(c.level<3){for(const f in F)for(const v of F[f])all.push({name:(c.level===2?'not ':'')+nm(f,v),f:[f],test:c.level===2?(i=>i[f]!==v):(i=>i[f]===v)});}
  else for(const cc of CNAME)for(const s of F.shape)all.push({name:cc+' '+s+'s',f:['colour','shape'],test:i=>i.colour===cc&&i.shape===s});
  const gen=(want,k,rule)=>{const out=[];let g=0;while(out.length<k&&g++<4000){const i={colour:pick(CNAME),shape:pick(F.shape),size:pick(SZ)};if(rule.test(i)===want)out.push(i);}return out;};
  let rule,items;
  for(let t=0;t<200;t++){rule=pick(all);items=shuffle([...gen(true,4,rule),...gen(false,4,rule)]);
    if(items.length===8&&all.filter(r=>items.every(i=>r.test(i)===rule.test(i))).length===1)break;}
  const trueLeft=Math.random()<.5;
  const side=i=>(rule.test(i)===trueLeft)?'L':'R';
  const placed={L:[],R:[]};let idx=0;const asked={};let guessing=false;const wrongGuess=new Set();
  placed[side(items[0])].push(items[0]);placed[side(items[1])].push(items[1]);idx=2;
  const itemEl=i=>h('span',{class:'pop'},shapeSVG(i.shape,i.colour,i.size==='big'?62:34));
  function render(){
    c.area.replaceChildren();
    if(guessing){
      const opts=new Set([rule.name]);while(opts.size<6)opts.add(pick(all).name);
      c.area.append(h('p',null,'What is the secret rule?'),
        h('div',{class:'chips'},shuffle([...opts]).map(n=>{const b=chip(n,()=>{
          if(n===rule.name){c.fx('explain','Yes! The rule is: '+rule.name+'.');
            c.area.replaceChildren(h('p',null,'You found it: '+rule.name+'.'),h('div',{class:'hoops'},['L','R'].map(s=>h('div',{class:'hoop'},placed[s].map(itemEl)))),btn('Tell Spark how it went','',()=>c.finish()));}
          else{wrongGuess.add(n);c.fx('retry','Not that one. Look at the hoops again. What is the same?');render();}
        });if(wrongGuess.has(n)){b.disabled=true;b.classList.add('no');}return b;})),
        btn('Back to the hoops','ghost',()=>{guessing=false;render();}));return;}
    const cur=items[idx];
    c.area.append(
      cur?h('div',{class:'big-item'},itemEl(cur)):h('p',null,'No more things. Time to guess the rule!'),
      h('div',{class:'hoops'},['L','R'].map(s=>h('button',{class:'hoop',type:'button','aria-label':'Put it in the '+(s==='L'?'left':'right')+' hoop',onclick:()=>choose(s),disabled:!cur},placed[s].map(itemEl)))),
      h('div',{class:'chips'},['colour','shape','size'].map(f=>{const b=chip({colour:'🎨 ',shape:'🔺 ',size:'📏 '}[f]+'Is it about '+f+'?',()=>{asked[f]=true;
        const yes=rule.f.includes(f);c.fx('question',yes?'Yes, the rule is about '+f+'.':'No, the rule is not about '+f+'.');render();});
        if(asked[f]){b.disabled=true;}return b;})),
      btn('I think I know the rule!','',()=>{guessing=true;render();}));
  }
  function choose(s){const cur=items[idx];const truth=side(cur);placed[truth].push(cur);idx++;
    if(s===truth)c.fx('predict','It went where you thought. What made you think so?');
    else c.fx('predict','Surprise! It went the other way. That is a clue. What is different about it?');
    render();}
  c.setAsk(()=>idx<items.length?[{q:'Can you show me one more?',a:'Here is the next one, placed for you.',run:()=>{const cur=items[idx];placed[side(cur)].push(cur);idx++;render();}}]:[]);
  c.say('Where does this one go? Guess first, then watch. Then find the secret rule.','think');
  render();}};

/* ===== Guess My Animal ===== */
const ANIMALS=[
 {e:'🐘',n:'elephant',fur:0,feathers:0,fly:0,water:0,four:1,big:1,pat:0,meat:0},
 {e:'🐅',n:'tiger',fur:1,feathers:0,fly:0,water:0,four:1,big:1,pat:1,meat:1},
 {e:'🐇',n:'rabbit',fur:1,feathers:0,fly:0,water:0,four:1,big:0,pat:0,meat:0},
 {e:'🦜',n:'parrot',fur:0,feathers:1,fly:1,water:0,four:0,big:0,pat:0,meat:0},
 {e:'🐊',n:'crocodile',fur:0,feathers:0,fly:0,water:1,four:1,big:1,pat:0,meat:1},
 {e:'🦈',n:'shark',fur:0,feathers:0,fly:0,water:1,four:0,big:1,pat:0,meat:1},
 {e:'🐠',n:'fish',fur:0,feathers:0,fly:0,water:1,four:0,big:0,pat:1,meat:0},
 {e:'🦋',n:'butterfly',fur:0,feathers:0,fly:1,water:0,four:0,big:0,pat:1,meat:0},
 {e:'🦁',n:'lion',fur:1,feathers:0,fly:0,water:0,four:1,big:1,pat:0,meat:1},
 {e:'🦓',n:'zebra',fur:1,feathers:0,fly:0,water:0,four:1,big:1,pat:1,meat:0}];
const AQ={fur:'Is it covered in fur?',feathers:'Does it have feathers?',fly:'Can it fly?',water:'Does it live in water?',four:'Does it have four legs?',big:'Is it bigger than a dog?',pat:'Does it have stripes or spots?',meat:'Does it eat meat?'};
const AI={fur:'🧥',feathers:'🪶',fly:'🕊️',water:'💧',four:'🐾',big:'🐘',pat:'🦓',meat:'🍖'};
GAMES.animal={title:'Guess My Animal',hat:'det',emoji:'🦁',blurb:'Ask yes or no questions. Find the secret animal.',
 levels:['8 animals','10 animals'],
 grown:{skill:'Asking questions that split a set in two; using answers to rule things out.',ask:'Which question helped you most? Is there a question that takes out lots of animals at once?',praise:'"That question took out lots of animals." "You asked before you guessed."'},
 init(c){
  const set=ANIMALS.slice(0,c.level===1?8:10);
  let mode='ask',secret=pick(set),alive=new Set(set.map((_,i)=>i)),asked=[],sel=null,found=false;
  const feats=Object.keys(AQ);
  function reset(m){q=null;mode=m;alive=new Set(set.map((_,i)=>i));asked=[];sel=null;found=false;if(m==='ask')secret=pick(set);render();}
  const cards=(clickable)=>h('div',{class:'cards'},set.map((a,i)=>h('button',{class:'card'+(alive.has(i)?'':' down')+(sel===i?' sel':'')+(mode==='swap'&&secret===a&&sel!==-1?' mine':''),type:'button',disabled:!clickable,
    onclick:()=>{sel=i;render();}},h('span',{class:'em','aria-hidden':'true'},a.e),h('small',null,a.n))));
  function render(){
    c.area.replaceChildren();
    if(mode==='ask'){
      if(found){c.area.append(h('p',null,'You found the '+secret.n+'! Which question helped you most?'),

<script>
(function(){
'use strict';
const {h,svg,rnd,pick,shuffle,btn,chip,COLORS,CNAME,GAMES}=window.LP;

/* ===== Tower of Hanoi ===== */
const DCOL=['#D6333B','#F2B705','#2E9E5B','#2F5BD6'];
GAMES.hanoi={title:'Tower of Hanoi',hat:'eng',emoji:'🗼',blurb:'Move the whole tower to the right peg.',

 grown:{skill:'Planning ahead; breaking a big problem into smaller ones.',ask:'How did you move the big disc? What did you do first, and why?',praise:'"You started again with a new plan." "You worked out where the small disc goes."'},
 init(c){
  const n=c.level===1?3:4;let pegs,sel,moves,predicted,firstMoved,done;
  function reset(){pegs=[Array.from({length:n},(_,i)=>n-i),[],[]];sel=null;moves=0;firstMoved=false;done=false;render();}
  function render(){
    c.area.replaceChildren();
    if(predicted==null&&!firstMoved)c.area.append(h('p',null,'Guess first: which disc will move first?'),
      h('div',{class:'chips'},Array.from({length:n},(_,i)=>i+1).map(s=>chip(s===1?'The smallest':s===n?'The biggest':n===3?'The middle one':s===2?'The second smallest':'The second biggest',()=>{predicted=s;c.fx('predict','Let us see!');render();}))));
    c.area.append(h('div',{class:'pegs'},pegs.map((p,pi)=>h('div',{class:'peg'+(sel===pi?' sel':''),role:'button',tabindex:'0','aria-label':'Peg '+(pi+1)+(p.length?', top disc size '+p[p.length-1]:', empty'),
      onclick:()=>tap(pi),onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(pi);}}},
      pi===2?h('span',{class:'goal','aria-hidden':'true'},'★'):null,p.map((s,k)=>h('div',{class:'disc'+(sel===pi&&k===p.length-1?' lift':''),style:'width:'+(28+s*(66/n))+'%;background:'+DCOL[s-1]}))))),
      h('div',{class:'row'},btn('Start again','ghost',()=>{if(moves)c.fx('persist');predicted=null;reset();})));
  }
  function tap(pi){
    if(done)return;
    if(sel==null){if(!pegs[pi].length)return;sel=pi;render();return;}
    if(sel===pi){sel=null;render();return;}
    const from=pegs[sel],to=pegs[pi],d=from[from.length-1];
    if(to.length&&to[to.length-1]<d){c.fx('retry','A bigger disc cannot sit on a smaller one. Try another peg.');const el=c.area.querySelectorAll('.peg')[pi];el&&el.classList.add('shake');sel=null;render();return;}
    from.pop();to.push(d);moves++;sel=null;
    if(!firstMoved){firstMoved=true;c.fx('try',predicted==null?'':(predicted===d?'You guessed the disc that moved first!':'The disc that moved was size '+d+'. Does that surprise you?'));}
    else c.fx('try');
    if(pegs[2].length===n){done=true;render();
      c.say('The whole tower moved!','wow','Can you teach someone how you did it?');
      c.area.append(h('p',null,'How did you do it? Tap one.'),h('div',{class:'chips'},['I moved the small one first','I moved the big one when the way was clear','I went step by step'].map(t=>chip(t,()=>c.fx('explain')))),btn('Tell Spark how it went','',()=>c.finish()));return;}
    render();}
  c.setAsk(()=>[{q:'How do I move just one disc?',a:'Lift it and put it on an empty peg, or on a bigger disc.'},
    {q:'What if I only had two discs?',a:'Small disc to the spare peg. Big disc to the goal peg. Then small disc on top of it.'},
    {q:'Where should the smallest disc go first?',a:n%2?'To the right peg, the goal peg.':'To the middle peg.'}]);
  c.say('Move all the discs to the star peg.','smile');
  reset();}};

/* ===== River Crossing ===== */
const CAST=[[{e:'🐺',n:'wolf'},{e:'🐐',n:'goat'},{e:'🥬',n:'cabbage'}],[{e:'🦊',n:'fox'},{e:'🐔',n:'hen'},{e:'🌽',n:'corn'}],[{e:'🐯',n:'tiger'},{e:'🦌',n:'deer'},{e:'🌿',n:'grass'}]];
GAMES.river={title:'River Crossing',hat:'eng',emoji:'🛶',blurb:'Row everyone across. Nobody gets eaten.',
 levels:['Wolf and goat','Fox and hen','Tiger and deer'],
 grown:{skill:'Planning with rules; seeing that going backwards can help.',ask:'Who is the tricky one? What did you try that did not work, and what did it tell you?',praise:'"You undid it and tried a new plan." "You noticed the goat is tricky."'},
 init(c){
  const [A,B,C]=CAST[c.level-1];const names=[A,B,C];
  let st={L:new Set([0,1,2]),R:new Set(),boat:'L',load:null};let hist=[],msg=null,predicted=null,crossings=0,blocked=false;
  const clone=s=>({L:new Set(s.L),R:new Set(s.R),boat:s.boat,load:null});
  function trouble(side){const g=st[side];if(g.has(0)&&g.has(1))return 'the '+A.n+' would eat the '+B.n;if(g.has(1)&&g.has(2))return 'the '+B.n+' would eat the '+C.n;return null;}
  function render(){
    c.area.replaceChildren();
    if(predicted==null&&!crossings)c.area.append(h('p',null,'Guess first: who should cross first?'),h('div',{class:'chips'},names.map((x,i)=>chip(x.e+' '+x.n,()=>{predicted=i;c.fx('predict','Let us try it!');render();}))));
    const bank=(side)=>h('div',{class:'bank'},[...st[side]].sort().map(i=>h('button',{class:'who-btn'+(st.load===i?' on':''),type:'button','aria-label':names[i].n,disabled:st.boat!==side,onclick:()=>{st.load=st.load===i?null:i;render();}},names[i].e)));
    c.area.append(h('div',{class:'river'},bank('L'),
      h('div',{class:'water'},h('span',{style:'font-size:2.4rem'},'🛶'),h('span',{class:'note'},'Farmer is on the '+(st.boat==='L'?'left':'right')+' bank'),
        st.load!=null?h('span',{style:'font-size:2rem'},'with '+names[st.load].e):h('span',{class:'note'},'Tap one to take along')),
      bank('R')),
      h('div',{class:'row'},(()=>{const r=btn('Row across','',row);if(blocked)r.disabled=true;return r;})(),btn('Undo','ghost',undo)),
      msg?h('p',{class:'note'},msg):null);
  }
  function row(){
    hist.push({L:new Set(st.L),R:new Set(st.R),boat:st.boat});
    const from=st.boat,to=from==='L'?'R':'L';
    if(st.load!=null){st[from].delete(st.load);st[to].add(st.load);}
    const moved=st.load;st.boat=to;st.load=null;crossings++;
    if(crossings===1&&predicted!=null)c.fx('try',moved===predicted?'You guessed who goes first!':'You took '+(moved==null?'nobody':names[moved].n)+' first. Let us see what happens.');
    else c.fx('try');
    const t=trouble(from);
    if(t){msg='Oh dear! '+t.charAt(0).toUpperCase()+t.slice(1)+' while the farmer is away. Tap Undo and try another plan.';blocked=true;c.fx('retry',msg);render();return;}
    msg=null;
    if(st.R.size===3){render();c.say('Everyone crossed safely!','wow','How did you solve it? Tap one.');
      c.area.append(h('div',{class:'chips'},['I took the '+B.n+' first','I brought one back','I tried and undid'].map(t=>chip(t,()=>c.fx('explain')))),btn('Tell Spark how it went','',()=>c.finish()));return;}
    render();}
  function undo(){if(!hist.length)return;const p=hist.pop();st={L:p.L,R:p.R,boat:p.boat,load:null};msg=null;blocked=false;c.fx('change');render();}
  c.setAsk(()=>[{q:'Who can stay together without the farmer?',a:'The '+A.n+' and the '+C.n+' can. The '+A.n+' does not eat the '+C.n+'.'},
    {q:'Who is the tricky one?',a:'The '+B.n+'. It cannot be left with the '+A.n+' or the '+C.n+'.'},
    {q:'Can the farmer bring someone back?',a:'Yes! Bringing someone back can be a clever move.'}]);
  c.say('Row everyone across. Who goes first?','smile','The '+A.n+' eats the '+B.n+'. The '+B.n+' eats the '+C.n+'.');render();}};

/* ===== Robot Walks ===== */
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const LV={1:{w:3,h:3,start:[0,2,0],tr:[2,0],rocks:[],pre:null},
 2:{w:4,h:4,start:[0,3,0],tr:[3,0],rocks:[[1,2],[2,1]],pre:null},
 3:{w:4,h:4,start:[0,3,0],tr:[3,0],rocks:[[1,2],[2,1]],pre:['F','F','F','R','F','F','L']}};
function solve(L){const k=s=>s.join();const q=[[L.start,[]]],seen=new Set([k(L.start)]);
  while(q.length){const [s,p]=q.shift();if(s[0]===L.tr[0]&&s[1]===L.tr[1])return p;
    for(const a of ['F','L','R']){const n=step(L,s,a);if(!n)continue;if(seen.has(k(n)))continue;seen.add(k(n));q.push([n,p.concat(a)]);}}return [];}
function step(L,s,a){let [x,y,d]=s;if(a==='L')return [x,y,(d+3)%4];if(a==='R')return [x,y,(d+1)%4];
  const nx=x+DIRS[d][0],ny=y+DIRS[d][1];if(nx<0||ny<0||nx>=L.w||ny>=L.h||L.rocks.some(r=>r[0]===nx&&r[1]===ny))return null;return [nx,ny,d];}
const CARD={F:'↑',L:'↶',R:'↷'};const CARDN={F:'Forward',L:'Turn left',R:'Turn right'};
GAMES.robot={title:'Robot Walks',hat:'eng',emoji:'🤖',blurb:'Give the robot cards to reach the treasure.',
 levels:['Small grid','Rocks','Find the bug'],
 grown:{skill:'Putting steps in order; finding and fixing a mistake (debugging).',ask:'Which card made the robot bump? What will you change?',praise:'"You found the card that was wrong." "You tested it, then changed it."'},
 init(c){
  const L=LV[c.level];let prog=L.pre?L.pre.slice():[];let sel=null,bad=null,run=null,rob=L.start.slice();let timer=null;
  const best=solve(L);
  c.onCleanup(()=>clearInterval(timer));
  function rb(d){return h('span',{style:'font-size:1.8rem','aria-hidden':'true'},'🤖');}
  function render(){
    c.area.replaceChildren();
    const cells=[];
    for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){
      const rock=L.rocks.some(r=>r[0]===x&&r[1]===y),tr=L.tr[0]===x&&L.tr[1]===y,here=rob[0]===x&&rob[1]===y;
      cells.push(h('div',{class:'cell'+(rock?' rock':'')+(here?' here':'')},here?[rb(rob[2]),h('span',{class:'arrowtag','aria-hidden':'true'},['↑','→','↓','←'][rob[2]])]:tr?'💎':rock?'🪨':''));}
    c.area.append(h('div',{class:'grid',style:'grid-template-columns:repeat('+L.w+',auto)'},cells),
      h('p',{class:'note'},'The robot faces '+['up','right','down','left'][rob[2]]+'. Its cards:'),
      h('div',{class:'prog','aria-label':'Robot cards'},prog.map((a,i)=>h('button',{class:'pc'+(sel===i?' sel':'')+(bad===i?' bad':''),type:'button','aria-label':CARDN[a],onclick:()=>{if(run)return;sel=sel===i?null:i;render();}},CARD[a]))),
      h('div',{class:'opts'},['F','L','R'].map(a=>h('button',{class:'btn ghost',type:'button',disabled:!!run,onclick:()=>add(a)},CARD[a]+' '+CARDN[a]))),
      h('div',{class:'row'},btn('Run!','',go),btn('Take a card away','ghost',()=>{if(run)return;if(sel!=null){prog.splice(sel,1);sel=null;}else prog.pop();bad=null;rob=L.start.slice();c.fx('change');render();}),btn('Clear','ghost',()=>{if(run)return;prog=[];sel=null;bad=null;rob=L.start.slice();render();})));
  }
  function add(a){if(sel!=null){prog[sel]=a;sel=null;c.fx('change');}else{if(prog.length>=10)return;prog.push(a);}bad=null;rob=L.start.slice();render();}
  function go(){
    if(run||!prog.length)return;rob=L.start.slice();bad=null;let i=0;run=true;render();c.fx('try');
    timer=setInterval(()=>{
      if(i>=prog.length){clearInterval(timer);run=null;
        if(rob[0]===L.tr[0]&&rob[1]===L.tr[1]){render();c.say('The robot found the treasure!','wow','Which card was the hardest to choose?');
          c.area.append(h('div',{class:'chips'},['The turns','The forward cards','Counting squares'].map(t=>chip(t,()=>c.fx('explain')))),btn('Tell Spark how it went','',()=>c.finish()));return;}
        c.fx('retry','The robot stopped on a different square. Tap a card to change it.');render();return;}
      const n=step(L,rob,prog[i]);
      if(!n){clearInterval(timer);run=null;bad=i;c.fx('retry','Bump! The robot hit something on card '+(i+1)+'. Which card could change?');render();return;}
      rob=n;i++;render();},450);}
  c.setAsk(()=>[{q:'Which way does the robot face?',a:'It starts facing '+['up','right','down','left'][L.start[2]]+' on the screen.'},
    {q:'How many squares to the treasure?',a:'Count along: '+(Math.abs(L.tr[0]-L.start[0]))+' across and '+(Math.abs(L.tr[1]-L.start[1]))+' up.'},
    {q:'What should the first card be?',a:best.length?'Try the "'+CARDN[best[0]]+'" card first.':'Try anything and see.'}]);
  c.say(L.pre?'This program has a bug! Run it, then find the card to change.':'Pick cards to guide the robot to the treasure. Then press Run.','smile');
  render();}};

/* ===== Right-and-Up Paths ===== */
GAMES.paths={title:'Right-and-Up Paths',hat:'eng',emoji:'🧭',blurb:'Find every way to get to the star.',
 levels:['2 by 2','2 by 3','3 by 3'],
 grown:{skill:'Finding all the possibilities with a system; knowing when you are finished.',ask:'How do you know we have them all? Is there a system?',praise:'"You used a system." "You checked for ones you missed."'},
 init(c){
  const W=[2,3,3][c.level-1],H=[2,2,3][c.level-1];
  const comb=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r);};
  const total=comb(W+H,H);let path=[[0,0]],found=[],keys=new Set(),predicted=null,msg='';
  const all=[];(function gen(s,x,y){if(x===W&&y===H){all.push(s);return;}if(x<W)gen(s+'R',x+1,y);if(y<H)gen(s+'U',x,y+1);})('',0,0);
  const CS=72,P=28;const X=x=>P+x*CS,Y=y=>P+(H-y)*CS;
  const toPts=k=>{let x=0,y=0;const p=[[0,0]];for(const ch of k){if(ch==='R')x++;else y++;p.push([x,y]);}return p;};
  function thumb(k){const s=svg('svg',{viewBox:'0 0 '+(W*20+10)+' '+(H*20+10),width:W*20+10,height:H*20+10,'aria-hidden':'true'});
    s.append(svg('polyline',{points:toPts(k).map(p=>(5+p[0]*20)+','+(5+(H-p[1])*20)).join(' '),fill:'none',stroke:'var(--hat)','stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round'}));return h('span',{class:'pop'},s);}
  function render(flash){
    const sv=svg('svg',{viewBox:'0 0 '+(P*2+W*CS)+' '+(P*2+H*CS),style:'max-width:100%;width:'+(P*2+W*CS)+'px;height:auto;touch-action:manipulation','role':'group','aria-label':'Grid of dots'});
    if(flash)sv.append(svg('polyline',{points:toPts(flash).map(p=>X(p[0])+','+Y(p[1])).join(' '),fill:'none',stroke:'var(--spark)','stroke-width':12,'stroke-linecap':'round','stroke-linejoin':'round',opacity:.9}));
    sv.append(svg('polyline',{points:path.map(p=>X(p[0])+','+Y(p[1])).join(' '),fill:'none',stroke:'var(--hat)','stroke-width':8,'stroke-linecap':'round','stroke-linejoin':'round'}));
    for(let x=0;x<=W;x++)for(let y=0;y<=H;y++){
      const cur=path[path.length-1],isCur=cur[0]===x&&cur[1]===y,goal=x===W&&y===H;
      const g=svg('g',{style:'cursor:pointer',tabindex:'0',role:'button','aria-label':'Dot '+x+','+y});
      g.append(svg('circle',{cx:X(x),cy:Y(y),r:goal?24:21,fill:isCur?'var(--hat)':'var(--surface)',stroke:'var(--ink)','stroke-width':3}));
      if(goal){const t=svg('text',{x:X(x),y:Y(y)+7,'text-anchor':'middle','font-size':22,fill:'var(--ink)'});t.textContent='★';g.append(t);}
      if(x===0&&y===0){const t=svg('text',{x:X(x),y:Y(y)+5,'text-anchor':'middle','font-size':13,'font-weight':800,fill:'var(--on-hat)'});t.textContent='';g.append(t);}
      g.addEventListener('click',()=>tap(x,y));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(x,y);}});
      sv.append(g);}
    c.area.replaceChildren();
    if(predicted==null)c.area.append(h('p',null,'Guess first: how many different paths are there?'),h('div',{class:'chips'},[...new Set([3,total-3,total,total+4].filter(n=>n>1))].sort((a,b)=>a-b).map(n=>chip(String(n),()=>{predicted=n;c.fx('predict','Nobody has told you. Let us find out!');render();}))));
    c.area.append(h('p',null,'Start at the bottom left. Tap dots to go right or up until you reach the star.'),h('div',{class:'center'},sv),
      h('div',{class:'row'},btn('Start this path again','ghost',()=>{path=[[0,0]];render();}),btn('I think we found them all','',all_)),
      msg?h('p',{class:'note'},msg):null,
      h('p',{class:'note'},'Paths found so far: '+found.length),h('div',{class:'row'},found.map(thumb)));
  }
  function tap(x,y){const cur=path[path.length-1];
    if(path.length>1){const pr=path[path.length-2];if(pr[0]===x&&pr[1]===y){path.pop();render();return;}}
    const ok=(x===cur[0]+1&&y===cur[1])||(x===cur[0]&&y===cur[1]+1);
    if(!ok){c.fx('retry','Only right or up, one step at a time. Try a dot next to the one you are on.');msg='';render();return;}
    path.push([x,y]);
    if(x===W&&y===H){const k=path.slice(1).map((p,i)=>p[0]>path[i][0]?'R':'U').join('');
      if(keys.has(k)){c.fx('retry','You found that one already. Look for a different way.');}
      else{keys.add(k);found.push(k);c.fx('try','A new path! That is '+found.length+'.');}
      path=[[0,0]];}
    render();}
  function all_(){
    if(found.length<total){c.fx('explain','Hmm, let us check. Try a system: always go Right first, then change the last move.');render();return;}
    c.fx('explain','You found them all! How did you know you had them all?');render();
    c.area.append(h('div',{class:'chips'},['I used a system','I checked each start','I kept trying until no new ones'].map(t=>chip(t,()=>c.fx('explain')))),btn('Tell Spark how it went','',()=>c.finish()));}
  c.setAsk(()=>[{q:'How many paths are there?',a:'There are '+total+' paths. Can you find them all?'},
    {q:'Is there a trick to find them all?',a:'Try a system. Always go Right first, then change the last move. Then change the move before.'},
    {q:'Show me one I have not found.',a:found.length<total?'Look at the yellow path.':'You have found every one already!',run:()=>{const m=all.find(k=>!keys.has(k));if(m)render(m);}}]);
  c.say('Find every different way to the star. You can only go right or up.','smile');render();}};
})();
</script>
<script>
(function(){
'use strict';
const {h,rnd,pick,shuffle,btn,chip,GAMES}=window.LP;

/* ===== True, False or Check It ===== */
const CLAIMS=[
 {t:'Fish live in trees.',a:'F'},{t:'Ice is cold.',a:'T'},{t:'Dogs can fly.',a:'F'},{t:'A triangle has three corners.',a:'T'},
 {t:'The sun comes out at night.',a:'F'},{t:'Bees make honey.',a:'T'},
 {t:'Everybody in the world likes pizza.',a:'C',how:['Ask lots of people','Look at the sky','Close my eyes'],right:0,l:2},
 {t:'It will rain tomorrow.',a:'C',how:['Wait and see tomorrow','Ask a toy','Count my fingers'],right:0,l:2},
 {t:'My teddy is the softest toy in the whole world.',a:'C',how:['Feel lots of toys','Ask my shoe','Look at the moon'],right:0,l:2},
 {t:'There are 7 stars here.',a:'F',vis:{e:'⭐',n:5}},{t:'There are 4 apples here.',a:'T',vis:{e:'🍎',n:4}},
 {t:'There are 3 fish here.',a:'F',vis:{e:'🐟',n:6}}];
GAMES.check={title:'True, False or Check It',hat:'sci',emoji:'🔬',blurb:'Is it true, false, or do we need to check?',
 levels:['True or false','Or check it'],
 grown:{skill:'Telling what we know from what we only think; saying how we know.',ask:'How do you know? Did you see it, try it, or get told?',praise:'"You said you wanted to check." "You told me how you know."'},
 init(c){
  const pool=shuffle(CLAIMS.filter(x=>c.level===2||x.a!=='C')).slice(0,6);let i=0,counted=new Set(),stage='pick';
  function render(){
    const q=pool[i];c.area.replaceChildren(h('h3',null,q.t));
    if(q.vis){c.area.append(h('div',{class:'shelf'},Array.from({length:q.vis.n},(_,k)=>h('button',{class:'chip'+(counted.has(k)?' on':''),type:'button','aria-label':'Count one',onclick:()=>{counted.add(k);render();}},q.vis.e))),
      h('p',{class:'note'},'Tap each one to count. Counted: '+counted.size));}
    if(stage==='pick'){
      c.area.append(h('div',{class:'opts'},btn('✅ True','',()=>pickA('T')),btn('❌ False','',()=>pickA('F')),c.level===2?btn('🔍 Check it','ghost',()=>pickA('C')):null));}
    else if(stage==='how'){c.area.append(h('p',null,'How do you know?'),h('div',{class:'chips'},['I saw it','I tried it','Someone told me','I worked it out'].map(t=>chip(t,()=>{c.fx('explain','Good. We can know things in different ways.');stage='next';render();}))));}
    else if(stage==='check'){c.area.append(h('p',null,'How could we check?'),h('div',{class:'chips'},shuffle(q.how.map((t,k)=>[t,k])).map(([t,k])=>chip(t,()=>{
      if(k===q.right){c.fx('explain','Yes! That would help us find out.');stage='next';render();}
      else c.fx('retry','Would that tell us? Think again.');}))));}
    if(stage==='next')c.area.append(btn(i<pool.length-1?'Next one':'Finish','',()=>{if(i<pool.length-1){i++;stage='pick';counted=new Set();render();c.say('True, false, or check it?','smile');}else c.finish();}));
  }
  function pickA(a){const q=pool[i];
    if(q.vis&&a==='C'){c.fx('try','Good idea! Tap each one to count, then say true or false.');return;}
    if(a===q.a){if(q.a==='C'){c.fx('predict','Yes, we cannot be sure yet.');stage='check';}else{c.fx('try','Yes.');stage='how';}render();}
    else if(q.a==='C'){c.fx('retry','Hmm, can we be sure? How could we find out?');}
    else c.fx('retry',q.vis?'Count again. Tap each one.':'Think again. Have you seen it? Tried it? Could we check?');}
  c.setAsk(()=>[{q:'How can I tell?',a:'Ask yourself: have I seen it, tried it, or been told?'},
    {q:'What does "check it" mean?',a:'It means we are not sure yet. We find out first, then decide.'}]);
  c.say('Is it true or false'+(c.level===2?', or do we need to check?':'?'),'smile');render();}};

/* ===== Sink or Float ===== */
const THINGS=[{e:'🪨',n:'stone',f:0},{e:'🪵',n:'wood',f:1},{e:'🍎',n:'apple',f:1},{e:'🔑',n:'key',f:0},{e:'🍃',n:'leaf',f:1},{e:'🪙',n:'coin',f:0},{e:'🦆',n:'rubber duck',f:1},{e:'🧊',n:'ice cube',f:1},{e:'🍊',n:'orange',f:1}];
const CLAY=[{e:'🟤',n:'clay ball',f:0},{e:'⛵',n:'clay boat',f:1}];
GAMES.float={title:'Sink or Float',hat:'sci',emoji:'💧',blurb:'Guess, test and compare.',
 levels:['Things','Change one thing'],
 grown:{skill:'Predicting, testing fairly and comparing; explaining a surprise.',ask:'Were you surprised? Why do you think it floated? What if we changed one thing?',praise:'"You guessed first." "You tested another one to find out."'},
 init(c){
  const items=c.level===2?CLAY.concat(THINGS.slice(0,4)):THINGS;let cur=null,pred=null,res=null,log=[];
  function render(){
    c.area.replaceChildren(h('div',{class:'shelf'},items.map((it,k)=>{const b=chip(it.e+' '+it.n,()=>{cur=k;pred=null;res=null;c.say('Will the '+it.n+' sink or float?','think');render();},cur===k?'on':'');return b;})));
    if(cur==null){c.area.append(h('p',{class:'note'},c.level===2?'Try the clay ball, then the clay boat. What changed?':'Pick something to test.'));}
    else{const it=items[cur];
      c.area.append(h('div',{class:'tank'+(res?(it.f?' float':' sink'):'')},h('span',{class:'thing','aria-hidden':'true'},it.e)));
      if(!res){if(pred==null)c.area.append(h('p',null,'Will it sink or float?'),h('div',{class:'opts'},btn('Sink','',()=>{pred='s';c.fx('predict','Now test it!');render();}),btn('Float','',()=>{pred='f';c.fx('predict','Now test it!');render();})));
        else c.area.append(h('p',null,'You think it will '+(pred==='f'?'float':'sink')+'.'),btn('Test it!','',test));}
      else{c.area.append(h('p',null,'The '+it.n+' '+(it.f?'floats':'sinks')+'.'));
        if((pred==='f')!==!!it.f)c.area.append(h('p',null,'Why do you think so?'),h('div',{class:'chips'},['It is light','It is heavy','It has air in it','I do not know. I will test another!'].map(t=>chip(t,()=>c.fx('explain')))));}}
    if(log.length)c.area.append(h('p',{class:'note'},'Tested: '+log.map(l=>l.e+(l.ok?' matched':' surprise')).join(' · ')));
  }
  function test(){const it=items[cur];res=it.f?'f':'s';const ok=(pred==='f')===!!it.f;log.push({e:it.e,ok});
    if(ok)c.fx('predict','It '+(it.f?'floated':'sank')+', like you thought.');
    else c.fx('predict','Surprise! You thought it would '+(pred==='f'?'float':'sink')+'. Surprises help scientists learn.');
    if(c.level===2&&it.n.startsWith('clay'))c.say('The clay ball and the clay boat are the same clay. What did we change?','think');
    render();}
  c.setAsk(()=>[{q:'What helps me guess?',a:'Think: is it heavy for its size? Does it have air inside?'},{q:'Which should I test first?',a:'Pick one you are not sure about. That is where you learn the most.'}]);
  c.say('Pick something. Guess if it will sink or float. Then test it.','smile');render();}};

/* ===== Who Knows? ===== */
const QL1=[{q:'What colour is a banana?',pic:'🍌',r:'Yellow',w:'Blue',owl:1},{q:'How many legs has a dog?',pic:'🐕',r:'Four',w:'Seven',owl:1},{q:'Where do fish live?',pic:'🐟',r:'In water',w:'In trees',owl:1},{q:'What is ice like?',pic:'🧊',r:'Cold',w:'Hot',owl:1},{q:'What do bees make?',pic:'🐝',r:'Honey',w:'Pizza',owl:0},{q:'Which animal says moo?',pic:'🐄',r:'A cow',w:'A duck',owl:1}];
const QL2=[{q:'What is bread made from?',pic:'🍞',r:'Flour',w:'Stones',t:'food'},{q:'What colour is a carrot?',pic:'🥕',r:'Orange',w:'Blue',t:'food'},{q:'Which is a fruit?',pic:'🍎',r:'An apple',w:'A shoe',t:'food'},
 {q:'What do rabbits like to eat?',pic:'🐇',r:'Carrots',w:'Fish',t:'animal'},{q:'How many legs has a spider?',pic:'🕷️',r:'Eight',w:'Four',t:'animal'},{q:'Where do penguins live?',pic:'🐧',r:'Cold places',w:'Hot deserts',t:'animal'}];
GAMES.whoknows={title:'Who Knows?',hat:'sci',emoji:'🦉',blurb:'Two puppets answer. Who can you trust?',
 levels:['Owl and Fox','Chef and Vet'],
 grown:{skill:'Judging who to trust from how often they were right; knowing that experts know some things only.',ask:'Who would you ask next time? Why? Would you ask the Chef about animals?',praise:'"You checked before you trusted." "You noticed who was right more often."'},
 init(c){
  const P=c.level===1?[{e:'🦉',n:'Owl'},{e:'🦊',n:'Fox'}]:[{e:'🧑‍🍳',n:'Chef'},{e:'🧑‍⚕️',n:'Vet'}];
  const Q=c.level===1?QL1:QL2;let asked=null,checked=false;const done=new Set();const tally=P.map(()=>({r:0,n:0}));
  const say=(qq,i)=>{if(c.level===1)return i===0?(qq.owl?qq.r:qq.w):(qq.owl&&Math.random()<.9?qq.w:(qq.owl?qq.w:qq.r));
    const good=(qq.t==='food')===(i===0);return good?qq.r:qq.w;};
  let answers=null;
  function render(){
    c.area.replaceChildren();
    if(asked==null){c.area.append(h('div',{class:'puppets'},P.map(p=>h('div',{class:'pup'},h('span',{class:'em','aria-hidden':'true'},p.e),h('b',null,p.n)))),h('p',null,'Pick a question to ask both puppets.'),h('div',{class:'chips'},Q.map((qq,k)=>{const b=chip(qq.pic+' '+qq.q,()=>ask(k));if(done.has(k))b.disabled=true;return b;})));}
    else{const qq=Q[asked];
      c.area.append(h('h3',null,qq.q),h('div',{class:'puppets'},P.map((p,i)=>{const ok=answers[i]===qq.r;
        return h('div',{class:'pup'+(checked?(ok?' right':' wrong'):'')},h('span',{class:'em','aria-hidden':'true'},p.e),h('b',null,p.n),h('span',null,'“'+answers[i]+'”'),checked?h('span',{class:'note'},ok?'was right':'was not right'):null);})),
        checked?h('div',{class:'center'},h('span',{style:'font-size:2.6rem','aria-hidden':'true'},qq.pic),h('b',null,'The answer: '+qq.r)):btn('Check the picture','',check),
        checked?btn('Ask another','',()=>{asked=null;checked=false;render();}):null);}
    if(tally.some(t=>t.n))c.area.append(h('p',{class:'note'},P.map((p,i)=>p.n+': '+tally[i].r+' right out of '+tally[i].n).join(' · ')));
    if(done.size>=3)c.area.append(h('p',null,c.level===1?'Who would you ask next time?':'Who would you ask about animals?'),h('div',{class:'chips'},P.map((p,i)=>chip(p.e+' '+p.n,()=>{c.fx('explain','Thank you. Why do you trust them?');
      c.area.append(h('div',{class:'chips'},['They were right more often','The other one said silly things','Just a feeling'].map(t=>chip(t,()=>c.fx('explain')))),btn('Tell Spark how it went','',()=>c.finish()));}))));
  }
  function ask(k){asked=k;checked=false;answers=P.map((_,i)=>say(Q[k],i));c.fx('question','Both puppets answered. Do they agree?');render();}
  function check(){checked=true;done.add(asked);P.forEach((_,i)=>{tally[i].n++;if(answers[i]===Q[asked].r)tally[i].r++;});c.fx('try','Checking the picture is how we find out who is right.');render();}
  c.setAsk(()=>[{q:'Who is right?',a:'I do not know yet. How could we find out?'},{q:'Can I trust someone who is wrong sometimes?',a:'Maybe, but watch how often. Keep a tally of who is right.'}]);
  c.say('Ask the puppets a question. Then check who is right.','smile');render();}};

/* ===== Last Stone Wins ===== */
const SLV=[{n:5,m:2},{n:7,m:2},{n:10,m:3}];
GAMES.stones={title:'Last Stone Wins',hat:'big',emoji:'🪨',blurb:'Take stones. Whoever takes the last one wins.',
 levels:['5 stones, take 1 or 2','7 stones, take 1 or 2','10 stones, take 1 to 3'],
 grown:{skill:'Working backwards from the end; finding a strategy by playing and noticing.',ask:'What did you notice when Spark lost? How many stones do you want to leave Spark?',praise:'"You tried a different first move." "You noticed a pattern."'},
 init(c){
  const {n,m}=SLV[c.level-1];let left=n,over=false,turn='you',first=true,lastFirst=null;
  c.onCleanup(()=>{});
  function render(){
    c.area.replaceChildren(h('div',{class:'stones'},Array.from({length:left},()=>h('span',{class:'stone'}))),
      h('p',{class:'note'},left+' stone'+(left===1?'':'s')+' left.'),
      over?null:h('div',{class:'opts'},Array.from({length:Math.min(m,left)},(_,k)=>k+1).map(k=>h('button',{class:'btn',type:'button',disabled:turn!=='you',onclick:()=>take(k)},'Take '+k))));}
  function end(who){over=true;render();
    c.say(who==='you'?'You took the last stone!':'Spark took the last stone.','smile',who==='you'?'How did you do it?':'What will you change next time?');
    c.area.append(h('div',{class:'chips'},['I took a different number first','I left Spark a special number','I am not sure yet'].map(t=>chip(t,()=>c.fx('explain')))),
      h('div',{class:'tray'},btn('Play again, try something different','',()=>{c.fx('change');left=n;over=false;turn='you';render();c.say('A new game. What will you try first?','smile');}),btn('Tell Spark how it went','ghost',()=>c.finish())));}
  function take(k){left-=k;c.fx('try');if(left===0){end('you');return;}turn='spark';render();
    c.later(()=>{let t=left%(m+1);if(t===0)t=1+rnd(Math.min(m,left));left-=t;c.say('Spark takes '+t+'.','smile');if(left===0){end('spark');return;}turn='you';render();},900);}
  c.setAsk(()=>[{q:'Does the number I leave matter?',a:'Yes! Some numbers are good to leave for Spark. Play again and notice what Spark could not beat.'},
    {q:'What should I take now?',a:(left%(m+1)===0?'Any number is fine now, but Spark may have the good position.':'Try taking '+(left%(m+1))+' so that '+(left-left%(m+1))+' are left.')}]);
  c.say('Take '+(m===2?'1 or 2':'1 to 3')+' stones each turn. Whoever takes the last stone wins. You go first.','smile');render();}};

/* ===== Tic-Tac-Toe Detectives ===== */
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
GAMES.ttt={title:'Tic-Tac-Toe Detectives',hat:'big',emoji:'❌',blurb:'Play, then go back to find where it changed.',
 levels:['Friendly Spark','Sharper Spark'],
 grown:{skill:'Spotting threats and chances; reviewing a game to find the turning point.',ask:'Where could you have stopped Spark? Where could Spark have stopped you?',praise:'"You went back and tried a different move." "You noticed Spark was about to win."'},
 init(c){
  let b,hist,over,flash=null,busy=false;
  const win=(bd,p)=>LINES.find(l=>l.every(i=>bd[i]===p));
  const winning=(bd,p)=>{const r=[];for(let i=0;i<9;i++)if(!bd[i]){bd[i]=p;if(win(bd,p))r.push(i);bd[i]=null;}return r;};
  function reset(){b=Array(9).fill(null);hist=[];over=false;busy=false;render();}
  function sparkMove(){const e=[...b.keys()].filter(i=>!b[i]);if(!e.length)return;
    const w=winning(b,'O');if(w.length)return w[0];
    const bl=winning(b,'X');if(bl.length&&(c.level===2||Math.random()<.5))return bl[0];
    if(c.level===2){if(!b[4])return 4;const cr=[0,2,6,8].filter(i=>!b[i]);if(cr.length)return pick(cr);}
    return pick(e);}
  function render(){
    c.area.replaceChildren(h('div',{class:'board'},b.map((v,i)=>h('button',{class:'sq'+(flash===i?' flash':''),type:'button','aria-label':'Square '+(i+1)+(v?', '+v:''),disabled:over||busy||!!v,onclick:()=>play(i)},v||''))));
    if(over)c.area.append(h('p',null,'Go back to a move and try something different:'),h('div',{class:'chips'},hist.map((m,k)=>m.p==='X'?chip('Before my move '+(Math.floor(k/2)+1),()=>rewind(k)):null).filter(Boolean)),btn('New game','ghost',reset));}
  function finish(){over=true;busy=false;const w=win(b,'X')?'x':win(b,'O')?'o':'d';
    render();c.say(w==='x'?'You got three in a row!':w==='o'?'Spark got three in a row.':'The board is full. No one got three.','smile','Where could you have stopped Spark, or made two chances at once?');}
  function play(i){if(busy)return;busy=true;b[i]='X';hist.push({p:'X',i});c.fx('try');if(win(b,'X')||b.every(Boolean)){finish();return;}
    render();c.later(()=>{const m=sparkMove();b[m]='O';hist.push({p:'O',i:m});if(win(b,'O')||b.every(Boolean)){finish();return;}busy=false;render();},600);}
  function rewind(k){const keep=hist.slice(0,k);b=Array(9).fill(null);keep.forEach(m=>b[m.i]=m.p);hist=keep;over=false;busy=false;c.fx('change','You went back. What will you try this time?');render();}
  function hl(cells){flash=cells[0];render();c.later(()=>{flash=null;render();},2000);}
  c.setAsk(()=>over?[]:[{q:'Can Spark win next turn?',a:(()=>{const w=winning(b,'O');return w.length?'Yes! Spark could win in the square that is lit up.':'No, Spark cannot win next turn.';})(),run:()=>{const w=winning(b,'O');if(w.length)hl(w);}},
    {q:'Can I win next turn?',a:(()=>{const w=winning(b,'X');return w.length?'Yes! Look at the square that is lit up.':'Not yet. Can you make two in a row?';})(),run:()=>{const w=winning(b,'X');if(w.length)hl(w);}},
    {q:'Where is a good place to start?',a:'The middle square gives you the most lines.'}]);
  c.say('You are X. Get three in a row.','smile','When it ends, you can go back and try a different move.');reset();}};

window.LP.boot();
})();
